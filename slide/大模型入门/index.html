## 01 · 大模型到底是个啥

*94.5 秒 · 9 章 · /slide/llm-explained.html*

- 它只做一件事：给定上文，算出下一个 token 的概率，填进去，再算下一个
- 「字」是 token：一个汉字约一到两个，英文长词会被切成几段
- 三个「大」同时加：参数、语料、算力；放大的斜率就是 Scaling Law
- 内部没有花招：注意力看谁跟谁有关，前馈层翻知识，同一块积木叠八十层
- 三堂课顺序不可换：预训练学世界，SFT 学问答，RLHF 学偏好
- 它优化的是「顺口」，不是「正确」：幻觉是出身，不是故障

Note:
这一集只需要带走一个动作：接下一个字。后面所有能力与缺陷，都是这个动作在不同输入上的重复。如果有人拿「理解」来解释它的行为，可以让他解释一下为什么它会在同样自信的语气下给出错误事实。

--

<iframe class="stretch" src="/slide/llm-explained.html" loading="lazy" allowfullscreen></iframe>

Note:
动画按章节推进，可以暂停、可以用方向键跳章。演示时建议停在「三个大」和「三堂课」两处，那两屏的信息密度最高。

--

### 原来如此

> 大模型就是一个读过全世界文字、把「猜下一个字」练到极致的高手。它很会说话——但它并不知道自己在说什么。

Note:
这句是整个系列的起点。它解释了为什么一个只会接字的模型能写代码、能做翻译，也解释了为什么它会在细节上翻车。

----

## 02 · 往深一层：字怎么变成数字

*119.0 秒 · 10 章 · /slide/llm-advanced.html*

- 四步预处理：切成 token → 变成向量 → 加位置编码 → 才进模型
- 注意力是三件套：每个词发出提问 Q、亮出名片 K、交出内容 V
- 多头并行：有的组管语法，有的管指代，有的管修饰关系
- 因果掩码不许偷看后文，这是「一个字一个字写」的制度基础
- 残差连接与归一化，是八十层不崩的前提
- 温度与 top-p 只改采样方式，不改模型判断

Note:
这一集最容易被当成数学课，其实重点只有两个：位置编码让顺序成为信息，因果掩码让训练目标成立。少了任何一个，模型都学不会预测。

--

<iframe class="stretch" src="/slide/llm-advanced.html" loading="lazy" allowfullscreen></iframe>

Note:
动画里注意力那一段值得反复看：Q/K/V 不是三个玄学符号，就是问、对、取三个动作。看完再回头看温度那一屏，会明白采样和判断是两件事。

--

### 原来如此

> 它是个极好的助手，但不是权威。它给出的每个字都「很像」，不等于「正确」。重要的事，永远自己核一遍。

Note:
顺带一句：聊天是给建议，Agent 是动手办。动手就要担责，所以第三节讲工具链时，设计会比聊天保守得多。

----

## 03 · Prompt、Thinking、Function Calling

*109.5 秒 · 10 章 · /slide/llm-agent-core.html*

- Prompt 的作用是把注意力拨过去，不是下命令
- 三条消息在模型那里会被拼成一整段文字，靠特殊标记分段
- 模型是无状态的：每次请求都重发全部历史，越聊越贵
- Thinking 的本质是造台阶：把中间结果写进上下文，后面才踩得住

```mermaid
flowchart LR
  A[消息列表] --> B[模型输出]
  B -->|直接回答| C[文字]
  B -->|结构化指令| D[你的程序执行]
  D --> A
```

Function Calling 只是生成一段结构化文字，执行的永远是你的程序。

Note:
这一集要把「模型写字」和「程序执行」彻底分开。很多人以为模型调用了接口，其实它只输出了一段长得像指令的文本。

--

<iframe class="stretch" src="/slide/llm-agent-core.html" loading="lazy" allowfullscreen></iframe>

Note:
演示时重点停在工具调用回路那一屏：四步、两次模型调用，中间那段全是你的代码。这是后面讲护栏和成本的基础。

--

### 原来如此

> Prompt 决定它看得见什么，Thinking 决定它想几步，Function Calling 决定它能动手到什么程度。三者共同的上限，都是同一件事：上下文里到底有什么。

Note:
所以提示词工程不是找咒语，是设计上下文。这个换算关系一旦建立，后面第四节到第十二节就都是同一件事的展开。

----

## 04 · 上下文工程与 Agent 可靠性

*107.5 秒 · 10 章 · /slide/llm-context-engineering.html*

- 上下文是桌面，不是硬盘：塞得进去不等于看得见
- 四层预算互相挤占：规则层、记忆层、历史层、任务层
- 压缩是折叠不是删除：留决定、留结论、留未完成
- 位置决定可见度：首尾强、中间弱，关键约束两头各写一次
- 上下文污染：它分不清「猜的」和「查到的」，错误会被继承
- 三个刹车：最大步数、幂等加重危确认、超时与降级

Note:
这一集讲的全是「让它不出事」，收益比换模型更稳定，因为它不依赖供应商的下一次发版。四个动作：放什么、放多少、按什么序、何时清。

--

<iframe class="stretch" src="/slide/llm-context-engineering.html" loading="lazy" allowfullscreen></iframe>

Note:
污染链那一屏是全集的重点：一个错误的假设被用户「确认」过一遍，就会在后续被当作事实引用。演示时值得把那条链一步步点出来。

--

### 原来如此

> 写在外面的约束，比写在提示词里的约束可靠。

Note:
提示词是建议，代码是约束。凡是「绝对不能发生」的事，都不该只写在系统提示里。

----

## 05 · 微调：把通用模型练成专属模型

*115.0 秒 · 11 章 · /slide/llm-finetune.html*

- 先分诊：缺知识、缺手艺、还是只是没读完文档
- 知识会过期，手艺不会：知识交给检索，手艺才值得练进去
- 全参微调要存优化器状态，7B 起步一百 GB 以上显存
- LoRA：冻结原权重，只训练一对小矩阵，参数量差约 256 倍
- QLoRA：底座压到 4bit 再冻结，消费级显卡可跑
- 训练只看验证集 loss；通用数据掺 10% 到 30% 防遗忘

Note:
这一集的价值一半在「什么时候不该微调」。四条不该做的理由里，知识频繁更新这一条最致命，因为它把一次成本变成了持续负债。

--

<iframe class="stretch" src="/slide/llm-finetune.html" loading="lazy" allowfullscreen></iframe>

Note:
显存对比那一屏建议多停一会。全参、LoRA、QLoRA 的差距不是优化技巧，是能不能开工的分界线。

--

### 原来如此

> 会变的东西放外面（检索），不变的东西练进去（微调）。能同时做到这两件事的系统，才叫可用。

Note:
顺序也建议按这个来：先改提示词，再做检索，最后才考虑微调。反过来做，通常是把钱花在了本该由文档解决的问题上。

----

## 06 · Token 与账单

*104.0 秒 · 10 章 · /slide/llm-token-cost.html*

- Token 不等于字数：中文约一字一点几 token，符号与数字最费
- 四档价：普通输入 1x、缓存命中约 0.1x、缓存写入略高于 1x、输出 3 到 5x
- 输出贵在串行：一个字一次前向，一千字一千个单位
- 缓存命中的前提苛刻：前缀一字不变，且必须放在最前面
- 真正的黑洞是多轮工具调用：每轮重发全部历史，总成本按三角形增长
- 六个开关：前缀缓存、限制输出、裁剪工具结果、模型路由、压缩历史、批处理

Note:
这一集要打破一个直觉：省钱不靠谈单价，靠改结构。先动上下文，再动轮数，最后才考虑换供应商。

--

<iframe class="stretch" src="/slide/llm-token-cost.html" loading="lazy" allowfullscreen></iframe>

Note:
演示时把「四轮任务的输入成本是单次的 7.5 倍」那一段讲清楚。听众多半会立刻想到自己的 Agent 任务有二十轮。

--

### 原来如此

> 成本是设计出来的，不是省出来的。上线前算一遍，比上线后砍一半容易得多。

Note:
一个具体的动作：上线前用 tokenizer 量一遍典型任务的输入输出，乘以单价。很多项目不是被能力卡住的，是被第一张月度账单卡住的。

----

## 07 · 量化与端侧推理

*100.0 秒 · 10 章 · /slide/llm-quantization.html*

- 一条公式：模型大小等于参数个数乘每个参数占几个字节
- 7B 模型：FP16 约 14GB、INT8 约 7GB、INT4 约 3.5GB
- 量化的核心问题不是要不要做，而是怎么分组
- 离群值会毁掉整层精度，所以必须分组加混合精度
- Q4_K_M：4 位、分组式、关键层混更高精度，社区公认的甜点
- 内存墙：权重只是入场费，KV cache 与运行时开销都要算

Note:
这一集顺带解决一个误解：量化不是「廉价版模型」，它是让模型离开机房、进入设备的那一步。整数化还是上 NPU 的门票。

--

<iframe class="stretch" src="/slide/llm-quantization.html" loading="lazy" allowfullscreen></iframe>

Note:
离群值那一屏是整个量化工程的核心。一个 15.8 就能把其余三十一个数的分辨率压到只剩正负八格，这就是为什么工程上不用整层量化。

--

### 原来如此

> 量化不改架构、不加参数，只是把每个数的写法从 32 位砍到 4 位——同一张成绩单换个写法。

Note:
决定端侧能不能跑的，不是「模型多大」，是权重、KV cache、运行时开销三者加起来多大。标称 4GB 的模型，真跑起来通常要 6GB 以上。

----

## 08 · 多模态：图片和声音怎么变成字符

*98.5 秒 · 10 章 · /slide/llm-multimodal.html*

- 模型的世界里只有数字：图文音最后都汇进同一个序列
- 图片三步：切 patch、编码成向量、拼进上下文
- 一张 1024 截图约等于五页文字，二十张高清图等于四十页文档
- 声音按 25 毫秒一帧，一分钟两千四百帧，贵在帧率
- 视频按指数爆炸，必须靠抽帧、降分辨率、时间合并做减法
- 四个翻车点：小字、计数、空间关系、二次压缩失真

Note:
这一集的落点是任务设计：它不是眼睛，是隔着毛玻璃看。把任务改造成它擅长的形状，比换更大的模型有效。

--

<iframe class="stretch" src="/slide/llm-multimodal.html" loading="lazy" allowfullscreen></iframe>

Note:
计 token 的那几屏很实用：图片成本是可以事前估的，宽除以块边乘高除以块边，估完再决定要不要缩图。

--

### 原来如此

> 模型从来不「看」，它只读数字。图片、声音、视频全都被翻译成同一种数字，翻译的精度，就是它「看」的上限。

Note:
实践里最常见的组合是分层：专用模型负责取（OCR 取字、ASR 取话、检测框取位置），通用模型负责串（回答人真正想问的问题）。

----

## 09 · 检索：为什么知识库总也搜不准

*100.5 秒 · 10 章 · /slide/llm-retrieval.html*

- 三种症状分三处病灶：装傻是召回问题，跑题是相关性问题，瞎编是生成问题
- 第一步永远是打印命中的原文片段，先分清没找到还是没好好答
- 语义检索懂人话，关键词检索认死理，缺一个就有一类问题搜不到
- 查询改写是翻译：用户嘴里的问法，和文档里的写法本来就不是一套

```mermaid
flowchart LR
  A[文档] --> B[按结构切块]
  B --> C[向量库]
  D[提问] --> E[查询改写]
  E --> C
  E --> F[关键词 BM25]
  C --> G[融合去重]
  F --> G
  G --> H[Rerank]
  H --> I[3 到 5 条进上下文]
```

切块决定上限，Rerank 只是把「找到了」变成「排对了」。

Note:
一个反直觉的分布：线上 RAG 的问题七成出在切块与召回，只有三成出在生成。所以钱和时间应该优先投在前半段。

--

<iframe class="stretch" src="/slide/llm-retrieval.html" loading="lazy" allowfullscreen></iframe>

Note:
混合检索那一屏建议对照着讲：同一句「东西坏了」，向量能命中售后政策，关键词一个字都对不上；反过来型号编号只有关键词能一击命中。

--

### 原来如此

> 检索做不好，往往不是库的问题，是「问法」和「写法」不匹配。改写就是在两者之间做翻译。

Note:
顺带一条土办法：如果文档是你自己写的，就按用户会怎么问来写标题。这一条的收益通常比调模型大得多。

----

## 10 · 把话说明白：提示词写法

*100.0 秒 · 10 章 · /slide/llm-prompt-craft.html*

- 换位思考：交给一个聪明但完全没有背景的新同事
- 五个要素：你是谁、做什么、材料在哪、不能怎样、什么格式
- 示例的锚定作用：两到三个，管格式、管粒度、管边界
- 顺序改变结论：先分析再结论，结论才不是找补
- 结构化排版防漏：标记框材料、要求编号、输出给模板
- 四个反模式：否定式指令、堆形容词、贪多求全、系统提示过长

Note:
这一集可以当工具课看，五要素是能直接抄走的模板。反模式那四条，几乎每条都对应一次真实的翻车。

--

<iframe class="stretch" src="/slide/llm-prompt-craft.html" loading="lazy" allowfullscreen></iframe>

Note:
左右对照那几屏最适合现场演示：同一句话模糊版和具体版各跑一次，差别是可见的，不需要解释。

--

### 原来如此

> 你觉得「不用说也懂」的部分，恰恰是模型最需要的那部分。

Note:
调提示词要像调代码：固定输入、单变量、留版本、跑全量。凭一条结果反复改词，改十版也不知道哪版更好。

----

## 11 · 上线前的那些坑

*98.0 秒 · 10 章 · /slide/llm-stream-ops.html*

- 流式不改变实际速度，只是把等待摊薄：首字延迟压到 1 秒内
- 流式带来四个新问题：中断无从续、半截 JSON、半截 Markdown、错误藏在流里
- 429 分三层：RPM、TPM、并发连接，长文档最容易打满 TPM
- 重试要有纪律：分类、指数退避加抖动、必须幂等
- 超时拆两段：首字 15 秒，总时长 120 秒，两种超时对应两种处置
- 上线后盯四个数：首字延迟 P95、输出速度、429 占比、重试成功率

Note:
这一集的分界线很清楚：本地跑通只证明它「能用」，流式、限流、超时、监控才决定它「能上线」。

--

<iframe class="stretch" src="/slide/llm-stream-ops.html" loading="lazy" allowfullscreen></iframe>

Note:
两个成本错觉值得强调：流式不省钱，用户关掉页面也不一定不花钱。真正省钱的地方还是砍输入、用缓存、选对档位、限输出。

--

### 原来如此

> 用户抱怨「慢」，抱怨的其实不是总时长，是那几秒什么都没发生。流式不改变实际速度，只是把等待摊薄了。

Note:
大模型应用最典型的故障不是崩了，是慢慢变差。四个埋点比四千行代码有用，因为它们让「慢慢变差」变成一条可见的曲线。

----

## 12 · 记忆：为什么昨天记得今天忘

*98.0 秒 · 10 章 · /slide/llm-memory.html*

- 模型本身没有记忆：全部世界就是这次请求里塞给它的那段文字
- 三层记忆：短期（当前对话）、长期（外部存储）、工作（任务中间状态）
- 存结论不存过程：目标、已决定、未完成、偏好，四类信息
- 写入时就考虑检索：记忆条目要写得「像问题」
- 冲突处理：覆盖式更新、带时间戳优先、硬软分层
- 遗忘要设计：TTL、降权、可删除；记忆面板必须可见

Note:
这一集最容易被跳过，但它直接决定产品的复购率。会话是无状态的，记忆是有状态的，合规权重完全不同。

--

<iframe class="stretch" src="/slide/llm-memory.html" loading="lazy" allowfullscreen></iframe>

Note:
冲突那一段值得多讲：两条记忆打架时，模型最糟的反应不是选错，是和稀泥编出一个折中值——它看起来最合理，所以最难被发现。

--

### 原来如此

> 记忆系统真正的难点不是「记住」，而是「在该想起的时候想起」。前者是存储问题，后者是检索问题。

Note:
而检索这半件事，第九节已经讲完了。这也是为什么记忆系统几乎总是和 RAG 共用一套向量基础设施。

----

## 13 · 从 Demo 到产品

*97.5 秒 · 10 章 · /slide/llm-to-product.html*

- 三个圈的交集才值得做：模型擅长、业务需要、必须现在做
- 一句话检验：谁、在什么场景、把什么变成什么
- 完成度分三档：六七十分可上线、八九十分可交付、九十五分可无人值守
- 三个上手方向按回报排序：内部效率、流程嵌入、用户功能
- 数据飞轮：埋点采集、抽样标注、进评测集、回归测试
- 度量看业务：处理量、人工介入率、平均时长、满意度

Note:
这一集的判断标准很硬：这件事交给一个实习生能做吗？如果连实习生都要培训三个月，大概率也不适合交给模型。

--

<iframe class="stretch" src="/slide/llm-to-product.html" loading="lazy" allowfullscreen></iframe>

Note:
完成度三档那段建议结合真实项目讲：绝大多数项目应该停在第一档，因为它最快产生价值，也最快暴露真实问题。

--

### 原来如此

> 模型能力决定下限，场景选择决定上限。选错场景，再强的模型也只是玩具。

Note:
最后一条不要漏：任何自动流程都要留人工兜底出口。用户知道随时有人接得住，才敢把事交给它。

## 14 · 从提示词到像素（专题）

*84.5 秒 · 8 章 · /slide/prompt-to-pixels.html*

- 它从来没画过东西：在噪声画布上一点点擦掉噪声，直到剩下可识别的图
- 前向加噪造训练对，反向去噪做推理，方向相反、参数同一套
- 从粗到细：前几步定轮廓，后几步补纹理，所以结构先出、细节后出
- CFG 用两次前向的差放大指令：k 太小不听，太大过饱和发僵
- 文生图搞不定三件事：构图、计数、图内文字
- 可控生成四件套：结构约束、区域约束、参考约束、迭代修正

Note:
这是系列里唯一的图像专题，接的是同一套逻辑：文字模型对齐下一个 token，画图模型对齐下一步噪声。都是「从上下文猜下一块」。

--

<iframe class="stretch" src="/slide/prompt-to-pixels.html" loading="lazy" allowfullscreen></iframe>

Note:
演示时可以停在 CFG 那一屏：系数 k 的两端各有各的坏法，中间七到十二是工程上的平衡点。

--

### 原来如此

> 文字给方向，图给约束。生成一张能用的图，主要靠修，不靠一次成功。

Note:
工程上还有两件事和文字模型不同：评价必须靠人筛，成本按张与分辨率计。这决定了图片产品的交互形态是「生成很多张，让人挑」。

----

# 收尾

### 十四集，一件事

- 它的全部动作是「从上下文猜下一块」：文字猜下一个 token，图片猜下一步噪声
- 真正决定产品好坏的，是围绕它叠出来的工程：上下文、工具、证据、护栏、评测
- 模型会继续换代，这套工程不会

Note:
如果只能留一句：把它当成一个聪明、勤奋、但完全不了解你的新同事。要做的不是找一句神奇的话，而是把背景、目标、约束、验收标准一件件交代清楚。
