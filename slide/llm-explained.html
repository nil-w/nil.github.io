<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大模型到底是个啥</title>
<style>
  html,body{margin:0;height:100%;background:#07090e;overflow:hidden;}
  canvas{display:block;cursor:pointer;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
"use strict";

const VW=1600, VH=900;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let scale=1, offX=0, offY=0, dpr=1;

const FONT='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif';
const MONO='Menlo,Consolas,"SF Mono",monospace';

const BG='#0a0d14', PANEL='#121824', PANEL2='#18212e', LINE='#2a3646',
      TXT='#e8eef8', DIM='#8a97a9', CYAN='#3ecde0', ORANGE='#ff9c42',
      PURPLE='#9c7eff', GREEN='#5cd692', PINK='#ff6c96', YELLOW='#f5d76e';

const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const cl01=x=>clamp(x,0,1);
const seg=(t,a,b)=>b<=a?(t>=b?1:0):cl01((t-a)/(b-a));
const eo=t=>1-Math.pow(1-cl01(t),3);
const lerp=(a,b,t)=>a+(b-a)*t;
function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mixc(c1,c2,t){const a=hex2rgb(c1),b=hex2rgb(c2);t=cl01(t);
  return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';}
function rgba(c,a){const r=hex2rgb(c);return 'rgba('+r[0]+','+r[1]+','+r[2]+','+cl01(a)+')';}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function T(s,x,y,size,color,align,weight,alpha){
  ctx.save();ctx.globalAlpha=alpha===undefined?1:cl01(alpha);
  ctx.fillStyle=color;ctx.font=(weight||400)+' '+size+'px '+FONT;
  ctx.textAlign=align||'left';ctx.textBaseline='middle';
  ctx.fillText(s,x,y);ctx.restore();
}
function TC(s,x,y,size,color,align,alpha){
  ctx.save();ctx.globalAlpha=alpha===undefined?1:cl01(alpha);
  ctx.fillStyle=color;ctx.font='400 '+size+'px '+MONO;
  ctx.textAlign=align||'left';ctx.textBaseline='middle';
  ctx.fillText(s,x,y);ctx.restore();
}
function box(x,y,w,h,fill,stroke,r,lw,alpha){
  ctx.save();ctx.globalAlpha=alpha===undefined?1:cl01(alpha);
  rr(x,y,w,h,r===undefined?12:r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.stroke();}
  ctx.restore();
}

/* ================= S0 标题 ================= */
function S0(t){
  const a1=eo(seg(t,0.1,1.0)), a2=eo(seg(t,0.6,1.5)), a3=eo(seg(t,1.2,2.1)), a4=eo(seg(t,1.8,2.6));
  const g=ctx.createRadialGradient(VW/2,VH/2-50,50,VW/2,VH/2-50,660);
  g.addColorStop(0,'rgba(62,205,224,0.13)');g.addColorStop(1,'rgba(62,205,224,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);

  T('大模型到底是个啥？',VW/2,VH/2-110,82,TXT,'center',700,a1);
  T('说白了 ———— 它是一个「接下一个字」练到极致的高手',VW/2,VH/2-20,36,CYAN,'center',400,a2);
  const lw=520*a3;
  ctx.strokeStyle=rgba(PURPLE,0.8*a3);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(VW/2-lw/2,VH/2+34);ctx.lineTo(VW/2+lw/2,VH/2+34);ctx.stroke();
  T('你给它半句话，它猜下一个字 —— 就这么简单',VW/2,VH/2+96,24,DIM,'center',400,a4);
  T('单词叫 token，所以业内说「下一个 token 预测」',VW/2,VH/2+150,15,rgba('#8a97a9',0.6),'center',400,a4);
}

/* ================= S1 猜下一个字 ================= */
const CANDSETS=[
  [['窗',62],['椅子',11],['地板',8],['沙发',6],['桌子',5]],
  [['前',58],['台',16],['边',9],['上',7],['外面',4]],
  [['，',41],['上',18],['旁边',14],['发呆',9],['看雨',5]]
];
const CYC=2.6;
function S1(t){
  T('它其实只会干一件事：猜下一个字',140,86,42,TXT,'left',700,eo(seg(t,0,0.4)));
  T('你给它半句话，它算出「下一个字最可能是啥」',140,136,22,DIM,'left',400,eo(seg(t,0.2,0.7)));

  const k=clamp(Math.floor(t/CYC),0,2);
  const ph=cl01((t%CYC)/CYC);
  const filled=Math.min(k,2);
  const set=CANDSETS[k];
  const pickWord=(k===0?'窗':(k===1?'前':'，'));

  // 句子
  box(140,180,1100,120,PANEL,mixc(LINE,CYAN,0.4),14,2,1);
  let sentence='一只猫坐在';
  if(k>=1)sentence+='窗';
  if(k>=2)sentence+='前';
  if(k>=3)sentence+='，';
  T(sentence,182,240,44,TXT,'left',400,1);

  // 光标 / 空格
  ctx.save();ctx.font='400 44px '+FONT;
  const sw=ctx.measureText(sentence).width;ctx.restore();
  if(k<3){
    const blink=(Math.floor(t*3)%2===0)?1:0.25;
    T('___',182+sw+8,240,44,rgba(CYAN,blink),'left',600,1);
  }else{
    T(sentence,182,240,44,TXT,'left',400,1);
  }

  // 候选卡
  const cw=200,chh=200,gp=20,x0=140,y0=360;
  T('它脑子里的打分（越高的越可能被选中）',140,y0-28,17,DIM,'left',600,1);
  for(let i=0;i<set.length;i++){
    const st=0.3+i*0.10;
    const a=eo(seg(ph,st,st+0.16));
    if(a<=0)continue;
    const x=x0+i*(cw+gp), p=set[i][1]/100;
    const isPick=(i===0);
    const sel=eo(seg(ph,0.62,0.78));
    const hot=isPick?sel:0;
    box(x,y0+20,cw,chh,mixc(PANEL,PANEL2,hot*0.8),
        isPick?rgba(CYAN,0.5+0.5*hot):rgba(LINE,0.9),14,isPick?2.4:1.4,0.35+0.65*a);
    T(String(set[i][1])+'%',x+cw/2,y0+62,32,isPick?CYAN:TXT,'center',700,0.35+0.65*a);
    T(set[i][0],x+cw/2,y0+112,30,TXT,'center',600,0.35+0.65*a);
    // 概率条
    ctx.save();ctx.globalAlpha=0.35+0.65*a;
    ctx.fillStyle=mixc(PURPLE,CYAN,p/0.62);
    const bw=(cw-60)*(p/0.62);
    rr(x+30,y0+chh+6,Math.max(3,bw),10,5);ctx.fill();ctx.restore();
  }

  // 选中提示
  const s2=eo(seg(ph,0.72,0.88));
  if(s2>0&&k<3){
    T('→ 选它！填进空格',80,y0+120,22,CYAN,'left',700,s2);
  }

  // 下方解释
  const b=eo(seg(t,3.0,3.8));
  const lines=[
    '它不是「懂」猫。是它读过太多「猫坐在…」的句子，见过窗、见过地板。',
    '猜得准不准，全看它读得多不多、见得多不多。',
    '写代码、做翻译、答问题 —— 说到底都是这样一句一句接出来的。'
  ];
  for(let i=0;i<3;i++){
    const a=eo(seg(t,3.0+i*0.5,3.5+i*0.5));
    T(lines[i],140,626+i*46,22,i===0?TXT:DIM,'left',400,a*0.95);
    ctx.fillStyle=rgba(CYAN,0.7*a);
    ctx.fillRect(120,626+i*46-9,5,18);
  }
}

/* ================= S2 三个大 ================= */
function drawKnob(cx,cy,r,color,a){
  ctx.save();ctx.globalAlpha=a;
  ctx.strokeStyle=rgba(color,0.85);ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI*0.75,Math.PI*2.25);ctx.stroke();
  ctx.fillStyle=rgba(color,0.10);
  ctx.beginPath();ctx.arc(cx,cy,r*0.86,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=rgba(color,0.95);ctx.lineWidth=4;ctx.lineCap='round';
  const ang=-Math.PI*0.62;
  ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.lineTo(cx+r*0.78*Math.cos(ang),cy+r*0.78*Math.sin(ang));ctx.stroke();
  ctx.restore();
}
function drawBooks(cx,cy,w,h,color,a){
  ctx.save();ctx.globalAlpha=a;
  const cols=[0.55,0.85,0.35];
  for(let i=0;i<3;i++){
    const y=cy+h/2-(i+1)*h*0.34;
    ctx.strokeStyle=rgba(color,cols[i]*0.95);ctx.lineWidth=3;
    ctx.fillStyle=rgba(color,0.07);
    rr(cx-w/2+i*4,y,w-i*8,h*0.30,4);ctx.fill();ctx.stroke();
  }
  ctx.restore();
}
function drawGear(cx,cy,r,color,a){
  ctx.save();ctx.globalAlpha=a;
  ctx.strokeStyle=rgba(color,0.9);ctx.lineWidth=3;
  for(let i=0;i<8;i++){
    const ang=i*Math.PI/4;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(ang)*r*0.78,cy+Math.sin(ang)*r*0.78);
    ctx.lineTo(cx+Math.cos(ang)*r*1.06,cy+Math.sin(ang)*r*1.06);
    ctx.stroke();
  }
  ctx.beginPath();ctx.arc(cx,cy,r*0.76,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,r*0.30,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
function S2(t){
  T('它凭什么厉害？三个「大」',140,86,42,TXT,'left',700,eo(seg(t,0,0.4)));
  T('脑子大 + 书读得多 + 练得久，三样缺一不可',140,136,22,DIM,'left',400,eo(seg(t,0.2,0.7)));

  const cards=[
    ['旋钮特别多','参数：几十亿到上万亿个','每被纠正一次，就拧一下旋钮','参数',CYAN],
    ['书读得特别多','几乎整个互联网的文字','见过的句子越多，接得越准','数据',PURPLE],
    ['练得特别久','几万张显卡连着跑几个月','烧的电费是天文数字','算力',ORANGE]
  ];
  const cw=390,chh=300,gp=40,total=3*cw+2*gp,x0=(VW-total)/2,y0=210;
  for(let i=0;i<3;i++){
    const st=0.4+i*0.5, a=eo(seg(t,st,st+0.5));
    if(a<=0)continue;
    const x=x0+i*(cw+gp);
    box(x,y0,cw,chh,mixc(BG,PANEL2,0.6),mixc(LINE,cards[i][4],0.55*a),16,1.8,a);
    const iy=y0+78;
    if(i===0)drawKnob(x+cw/2,iy,42,cards[i][4],a);
    if(i===1)drawBooks(x+cw/2,iy,120,86,cards[i][4],a);
    if(i===2)drawGear(x+cw/2,iy,40,cards[i][4],a);
    T(cards[i][0],x+cw/2,y0+168,28,TXT,'center',700,a);
    T(cards[i][1],x+cw/2,y0+212,17,cards[i][4],'center',500,a*0.95);
    T(cards[i][2],x+cw/2,y0+252,16,DIM,'center',400,a*0.9);
  }

  const b=eo(seg(t,3.2,4.0));
  if(b>0){
    box(190,556,1220,80,PANEL,mixc(LINE,CYAN,0.45),12,1.8,b);
    T('就像养学生',228,596,19,CYAN,'left',700,b);
    T('脑子好 + 书读得多 + 练得久 —— 三样同时加，本事才会涨，而且涨得很有规律。',420,596,19,TXT,'left',400,b);
  }
  const c=eo(seg(t,4.6,5.4));
  T('这个规律业内叫 Scaling Law：规模翻倍，错误率按固定斜率往下掉。',190,676,17,DIM,'left',400,c*0.95);
}

/* ================= S3 里面长什么样 ================= */
function S3(t){
  T('扒开看，里面长这样',140,86,42,TXT,'left',700,eo(seg(t,0,0.4)));
  T('没有别的花招：同一块积木，重复叠 80 次',140,136,22,DIM,'left',400,eo(seg(t,0.2,0.7)));

  // 左：积木堆
  const LX=170, LW=270, LH=26, LG=9, N=11;
  const baseY=760;
  box(LX,baseY-46,LW,46,mixc(BG,PANEL2,0.8),rgba(CYAN,0.6),8,1.5,eo(seg(t,0.4,0.8)));
  T('把字变成数字',LX+LW/2,baseY-23,15,TXT,'center',600,eo(seg(t,0.4,0.8)));
  for(let i=0;i<N;i++){
    const st=0.9+i*0.13, a=eo(seg(t,st,st+0.25));
    if(a<=0)continue;
    const y=baseY-46-10-(i+1)*(LH+LG);
    box(LX,y,LW,LH,mixc(BG,PURPLE,0.35),rgba(PURPLE,0.6),5,1,a);
  }
  const topY=baseY-46-10-N*(LH+LG);
  box(LX,topY-52,LW,46,mixc(BG,PANEL2,0.8),rgba(GREEN,0.6),8,1.5,eo(seg(t,2.6,3.0)));
  T('猜下一个字',LX+LW/2,topY-29,15,TXT,'center',600,eo(seg(t,2.6,3.0)));
  T('×80 层',LX+LW+18,baseY-270,17,PURPLE,'left',700,eo(seg(t,2.4,2.9)));

  // 右：放大一层
  const X=620,Y=210,W2=790;
  const a1=eo(seg(t,2.8,3.4));
  T('每一层只做两个动作：',X,Y,22,TXT,'left',700,a1);

  const steps=[
    ['① 看看谁跟谁有关系','读到「它」的时候，回头找「它」指谁。\n读到「猫」的时候，知道后面该跟动词。',
     '专业名词：注意力机制 / Self-Attention',CYAN],
    ['② 翻记忆找知识','想到「猫」，就把关于猫的一堆常识调出来：\n会喵、怕水、爱吃鱼。',
     '专业名词：前馈层 / FFN，这里是吃参数最多的地方',ORANGE]
  ];
  for(let i=0;i<2;i++){
    const st=3.4+i*1.0, a=eo(seg(t,st,st+0.5));
    if(a<=0)continue;
    const y=Y+46+i*194;
    box(X,y,W2,170,mixc(BG,PANEL2,0.6),mixc(LINE,steps[i][3],0.55*a),14,1.8,a);
    T(steps[i][0],X+28,y+42,26,steps[i][3],'left',700,a);
    const ls=steps[i][1].split('\n');
    for(let j=0;j<ls.length;j++)T(ls[j],X+28,y+88+j*32,19,TXT,'left',400,a*0.95);
    T(steps[i][2],X+28,y+148,14,DIM,'left',400,a*0.85);
  }
  const b=eo(seg(t,6.0,6.6));
  T('就这两个动作，反反复复 80 次。所有的「聪明」，是从这里长出来的。',X,Y+480,20,CYAN,'left',600,b*0.95);
}

/* ================= S4 三堂课 ================= */
function S4(t){
  T('它是怎么被教出来的',140,86,42,TXT,'left',700,eo(seg(t,0,0.4)));
  T('一共上三堂课，顺序不能乱',140,136,22,DIM,'left',400,eo(seg(t,0.2,0.7)));

  const CLS=[
    ['第一课','海量读书','把全世界的文字读一遍',
     '读的时候一直做练习：遮住下一个字，自己猜，\n猜错就拧一下旋钮。重复几万亿次。',
     '学的是：怎么说话、世界上都有啥','预训练 / Pretraining',CYAN],
    ['第二课','老师示范','人写几万条问答给它照抄',
     '原来它只会接着往下写，不会「回答问题」。\n看几万条示范，才学会你问我答。',
     '学的是：听指令、按格式回答','监督微调 / SFT',PURPLE],
    ['第三课','按喜好打分','人类给它打好评差评',
     '同一个问题它答十个版本，人来排序哪个更好。\n它就朝着「人更喜欢的那个方向」调整。',
     '学的是：说什么讨喜、什么不能说','人类反馈强化学习 / RLHF',ORANGE]
  ];
  const cw=390,chh=330,gp=40,total=3*cw+2*gp,x0=(VW-total)/2,y0=200;
  for(let i=0;i<3;i++){
    const st=0.4+i*0.6, a=eo(seg(t,st,st+0.5));
    if(a<=0)continue;
    const x=x0+i*(cw+gp);
    box(x,y0,cw,chh,mixc(BG,PANEL2,0.6),mixc(LINE,CLS[i][6],0.55*a),16,1.8,a);
    T(CLS[i][0],x+26,y0+38,16,CLS[i][6],'left',700,a);
    T(CLS[i][1],x+26,y0+82,28,TXT,'left',700,a);
    T(CLS[i][2],x+26,y0+126,16,DIM,'left',400,a*0.95);
    const ls=CLS[i][3].split('\n');
    for(let j=0;j<ls.length;j++)T(ls[j],x+26,y0+172+j*26,15,TXT,'left',400,a*0.85);
    T(CLS[i][4],x+26,y0+258,15,CLS[i][6],'left',600,a*0.9);
    T(CLS[i][5],x+26,y0+292,12,DIM,'left',400,a*0.7);
    if(i<2){
      const ax=x+cw+8;
      ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=rgba(CYAN,0.8);ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(ax,y0+chh/2);ctx.lineTo(ax+gp-16,y0+chh/2);ctx.stroke();
      ctx.restore();
    }
  }

  const b=eo(seg(t,3.6,4.2));
  if(b>0){
    box(190,566,1220,86,PANEL,mixc(LINE,PINK,0.5),12,1.8,b);
    T('记牢这句',228,609,19,PINK,'left',700,b);
    T('它知道的每一件事，都是第一课学的。后两课只教它「怎么说话好听」。',400,609,19,TXT,'left',400,b);
  }
  const c=eo(seg(t,5.0,5.6));
  T('所以想让它记住你们公司的内部资料，靠「再教它一遍」是不行的 —— 得让它现查（下文说）。',190,700,17,DIM,'left',400,c*0.95);
}

/* ================= S5 它在忙什么 ================= */
function S5(t){
  T('它回你话的时候，在忙啥',140,86,42,TXT,'left',700,eo(seg(t,0,0.4)));
  T('分两步，快慢完全不一样',140,136,22,DIM,'left',400,eo(seg(t,0.2,0.7)));

  // 第一步
  const a1=eo(seg(t,0.4,0.9));
  T('第一步：把你说的话整段读一遍',140,205,26,CYAN,'left',700,a1);
  T('很快 —— 所有字一起处理，一次算完',740,205,17,DIM,'left',400,a1*0.9);
  const pw=110,pg=16,px=140,py=240;
  for(let i=0;i<7;i++){
    const st=0.8+i*0.07, a=eo(seg(t,st,st+0.2));
    if(a<=0)continue;
    box(px+i*(pw+pg),py,pw,56,mixc(PANEL,CYAN,0.28*a),rgba(CYAN,0.85*a),8,1.5,a);
    T('字'+i,px+i*(pw+pg)+pw/2,py+28,15,TXT,'center',500,a);
  }

  // 第二步
  const a2=eo(seg(t,2.2,2.7));
  T('第二步：一个字一个字往外蹦',140,360,26,ORANGE,'left',700,a2);
  T('很慢 —— 每蹦一个字，都要把整个脑子从头过一遍',740,360,17,DIM,'left',400,a2*0.9);
  const dy=395;
  const gen=['一','只','猫','坐','在','窗','前','…'];
  for(let i=0;i<8;i++){
    const st=2.7+i*0.45, a=eo(seg(t,st,st+0.24));
    if(a<=0)continue;
    box(px+i*(pw+pg),dy,pw,56,mixc(PANEL,ORANGE,0.28*a),rgba(ORANGE,0.85*a),8,1.5,a);
    T(gen[i],px+i*(pw+pg)+pw/2,dy+28,22,TXT,'center',600,a);
  }
  const a2b=eo(seg(t,6.4,6.9));
  T('所以你看到字一个一个「打」出来，不是特效，是真的在一个一个算。',140,480,20,TXT,'left',400,a2b*0.95);

  // 草稿纸
  const a3=eo(seg(t,7.4,8.0));
  if(a3>0){
    box(140,540,780,110,PANEL,mixc(LINE,PURPLE,0.5),12,1.8,a3);
    T('草稿纸',176,578,18,PURPLE,'left',700,a3);
    T('它把刚说过的每个字都记在一张草稿纸上，省得反复重算。',260,578,17,TXT,'left',400,a3);
    T('但聊完就扔，不会带进下一段对话。',176,616,16,DIM,'left',400,a3*0.9);
  }
  const a4=eo(seg(t,8.8,9.4));
  T('慢不是因为算不动，是「翻得慢」—— 每蹦一个字，都要把全部家当搬一遍。',940,578,18,TXT,'left',400,a4*0.95)
}

/* ================= S6 为什么瞎编 ================= */
const BAD=[
  ['它要的是「顺口」，不是「正确」','接得顺嘴就吐出来，不管真假。\n所以会一本正经地胡说八道。',PINK],
  ['它记性只有这一段对话','聊完就忘。不会记住你昨天说过啥，\n也不会自己积累经验。',CYAN],
  ['什么都懂一点，什么都不精','常识很行；专业细节容易翻车，\n尤其是很窄、很少见的领域。',ORANGE],
  ['它只会说，不会做','不能上网、不能查库、不能点按钮。\n要动手，得别人给它装手脚。',PURPLE]
];
function S6(t){
  T('它为什么爱一本正经地瞎编',140,86,42,TXT,'left',700,eo(seg(t,0,0.4)));
  T('不是坏了，是出身决定的 —— 它天生追求「像」，不追求「对」',140,136,22,DIM,'left',400,eo(seg(t,0.2,0.7)));

  const cw=610,chh=200,gp=40,x0=140,y0=210;
  for(let i=0;i<4;i++){
    const st=0.4+i*0.5, a=eo(seg(t,st,st+0.45));
    if(a<=0)continue;
    const x=x0+(i%2)*(cw+gp), y=y0+Math.floor(i/2)*(chh+gp);
    box(x,y,cw,chh,mixc(BG,PANEL2,0.6),mixc(LINE,BAD[i][2],0.55*a),16,1.8,a);
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle=rgba(BAD[i][2],0.95);
    ctx.fillRect(x+28,y+34,6,40);ctx.restore();
    T(BAD[i][0],x+52,y+54,25,TXT,'left',700,a);
    const ls=BAD[i][1].split('\n');
    for(let j=0;j<ls.length;j++)T(ls[j],x+52,y+112+j*30,18,DIM,'left',400,a*0.95);
  }

  const b=eo(seg(t,3.2,3.8));
  if(b>0){
    box(140,640,1260,78,PANEL,mixc(LINE,CYAN,0.45),12,1.8,b);
    T('所以要这么用',176,679,18,CYAN,'left',700,b);
    T('要准的事实 → 让它现查资料；要真动手 → 给它装工具；要绝对可靠 → 别用它拍板。',380,679,18,TXT,'left',400,b);
  }
}

/* ================= S7 别搞混 ================= */
const TB=[
  ['传统 AI','专门训练出来干一件事的程序','比如只认人脸。大模型是一个顶一堆',CYAN],
  ['知识库','一堆资料，能按关键词查出来','大模型记不住细节，得靠它现查（叫 RAG）',PURPLE],
  ['Agent','给大模型装上手脚','让它能真去点按钮、发邮件、调接口',ORANGE],
  ['画图模型','另一个流派：靠擦噪点作画','一个猜字，一个擦噪点，两回事',PINK]
];
function S7(t){
  T('几个名字，别搞混',140,86,42,TXT,'left',700,eo(seg(t,0,0.4)));

  const x=140,y0=180,chh=100;
  T('名字',x+26,y0-26,15,DIM,'left',600,1);
  T('大白话',x+300,y0-26,15,DIM,'left',600,1);
  T('跟大模型什么关系',x+700,y0-26,15,DIM,'left',600,1);

  for(let i=0;i<TB.length;i++){
    const st=0.4+i*0.55, a=eo(seg(t,st,st+0.42));
    if(a<=0)continue;
    const y=y0+i*chh;
    box(x,y,1260,84,mixc(BG,PANEL2,0.5),rgba(LINE,0.9*a),12,1.2,a);
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle=rgba(TB[i][3],0.95);
    ctx.fillRect(x,y+20,6,44);ctx.restore();
    T(TB[i][0],x+30,y+42,22,TXT,'left',700,a);
    T(TB[i][1],x+300,y+42,18,DIM,'left',400,a*0.95);
    T(TB[i][2],x+700,y+42,18,TXT,'left',400,a*0.95);
  }
  const b=eo(seg(t,4.4,5.0));
  T('记住：大模型是「嘴」，其余都是给它配的「眼睛、手和笔记本」。',140,660,20,CYAN,'left',600,b*0.95);
}

/* ================= S8 收尾 ================= */
function S8(t){
  const a1=eo(seg(t,0.1,0.7)), a2=eo(seg(t,0.8,1.4)), a3=eo(seg(t,1.5,2.1));
  const g=ctx.createRadialGradient(VW/2,VH/2,40,VW/2,VH/2,580);
  g.addColorStop(0,'rgba(62,205,224,0.10)');g.addColorStop(1,'rgba(62,205,224,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);

  T('一句话说完',VW/2,190,17,CYAN,'center',600,a1);
  T('大模型，就是一个读过全世界文字、',VW/2,272,42,TXT,'center',700,a1);
  T('把「猜下一个字」练到极致的高手。',VW/2,342,42,TXT,'center',700,a1);
  T('它很会说话 —— 但它并不知道自己在说什么。',VW/2,438,34,YELLOW,'center',600,a2);

  ctx.strokeStyle=rgba(PURPLE,0.65*a3);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(VW/2-330,510);ctx.lineTo(VW/2+330,510);ctx.stroke();

  T('怎么看它是不是大模型：几十亿参数以上 · 什么都能干不是只会一件 · 靠接龙或擦噪点出结果',
    VW/2,566,19,DIM,'center',400,a3);

  const b=eo(seg(t,2.4,3.0));
  T('空格 暂停 / 播放    ←  →  切换章节    点进度条跳转',VW/2,800,16,DIM,'center',400,b*0.8);
}

/* ================= 时间轴 ================= */
const SCENES=[
  {n:'标题',    d:4.5, f:S0},
  {n:'猜下一个字',d:15.0,f:S1},
  {n:'三个大',  d:11.0,f:S2},
  {n:'里面长啥样',d:11.0,f:S3},
  {n:'三堂课',  d:12.0,f:S4},
  {n:'它在忙啥',d:12.0,f:S5},
  {n:'为什么瞎编',d:11.0,f:S6},
  {n:'别搞混',  d:10.0,f:S7},
  {n:'收尾',    d:8.0, f:S8}
];
const TOTAL=SCENES.reduce((s,x)=>s+x.d,0);

let clock=0, playing=true, last=0;

function locate(g){
  let acc=0;
  for(let i=0;i<SCENES.length;i++){
    if(g<acc+SCENES[i].d||i===SCENES.length-1)return {i:i,t:g-acc};
    acc+=SCENES[i].d;
  }
  return {i:SCENES.length-1,t:SCENES[SCENES.length-1].d};
}

function drawTopHUD(idx){
  T('大模型到底是个啥',44,34,15,DIM,'left',600,1);
  T('/ '+SCENES[idx].n,190,34,15,CYAN,'left',600,1);
}

function drawProgress(g){
  const y=VH-8;
  ctx.fillStyle='rgba(40,52,68,0.9)';ctx.fillRect(0,y,VW,3);
  ctx.fillStyle=CYAN;ctx.fillRect(0,y,VW*(g/TOTAL),3);
  let acc=0;
  for(let i=0;i<SCENES.length;i++){
    const x=VW*(acc/TOTAL);
    ctx.fillStyle=BG;ctx.fillRect(x-1,y-3,2,9);
    acc+=SCENES[i].d;
  }
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=BG;ctx.fillRect(0,0,cv.width/dpr,cv.height/dpr);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,offX*dpr,offY*dpr);

  const loc=locate(clock);
  const sc=SCENES[loc.i];
  const fin=cl01(loc.t/0.42), fout=cl01((sc.d-loc.t)/0.34);
  const alpha=Math.min(fin,fout);

  ctx.save();ctx.globalAlpha=alpha;sc.f(loc.t);ctx.restore();
  drawTopHUD(loc.i);
  drawProgress(clock);
}

function loop(ts){
  if(!last)last=ts;
  let dt=(ts-last)/1000;last=ts;
  if(dt>0.12)dt=0.12;
  if(playing){clock+=dt;if(clock>=TOTAL)clock=0;}
  render();
  requestAnimationFrame(loop);
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const w=window.innerWidth,h=window.innerHeight;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  cv.style.width=w+'px';cv.style.height=h+'px';
  scale=Math.min(w/VW,h/VH);
  offX=(w-VW*scale)/2;offY=(h-VH*scale)/2;
}
window.addEventListener('resize',resize);

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();playing=!playing;last=0;}
  else if(e.code==='ArrowRight'){
    const loc=locate(clock);let acc=0,target=Math.min(loc.i+1,SCENES.length-1);
    for(let i=0;i<SCENES.length;i++){if(i===target){clock=acc;break;}acc+=SCENES[i].d;}
    last=0;
  } else if(e.code==='ArrowLeft'){
    const loc=locate(clock);let acc=0,target=Math.max(loc.i-1,0);
    for(let i=0;i<SCENES.length;i++){if(i===target){clock=acc;break;}acc+=SCENES[i].d;}
    last=0;
  } else if(e.key==='r'||e.key==='R'){clock=0;last=0;playing=true;}
});

cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  const w=r.width,h=r.height;
  const s=Math.min(w/VW,h/VH);
  const ox=(w-VW*s)/2, oy=(h-VH*s)/2;
  const vx=(e.clientX-r.left-ox)/s, vy=(e.clientY-r.top-oy)/s;
  if(vy>VH-24){clock=cl01(vx/VW)*TOTAL;last=0;}
  else {playing=!playing;last=0;}
});

try{
  const qp=new URLSearchParams(location.search);
  if(qp.has('t')){
    const v=parseFloat(qp.get('t'));
    if(!isNaN(v))clock=Math.max(0,Math.min(TOTAL-0.04,v));
  }
  if(qp.get('pause')==='1')playing=false;
}catch(err){}

resize();
requestAnimationFrame(loop);
})();
</script>
