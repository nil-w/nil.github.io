  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@12.2.0/+esm";
  let theme = localStorage.getItem("s");
  mermaid.initialize({
      startOnLoad: true,
      logLevel: 'error',
      securityLevel: 'strict',
      theme: theme === '2' ? 'forest' : 'dark',
    });
  let mode = document.getElementById("dark-mode");
   let arrayGraphs =  [];
  let nodes = document.getElementsByClassName('mermaid')
  for(let n of nodes){
    arrayGraphs.push(n.innerHTML);
  }

  if (mode) mode.addEventListener("click",async ()=>{
    theme = localStorage.getItem("s");
    mermaid.initialize({
      startOnLoad: true,
      logLevel: 'error',
      securityLevel: 'strict',
      theme: theme === '2' ? 'forest' : 'dark',
    });
  for(let i = 0;i< nodes.length;i++){
      let n =  nodes[i]
      let id = `mermaid-${i}`
      n.removeAttribute("data-processed");
      n.setAttribute("id",`mermaid-${i}`)
      n.replaceChildren();
      n.innerHTML = arrayGraphs[i]
      mermaid.run({ nodes: [n] })
    }
  },false);

  // 加密文章解密后，hexo-blog-encrypt 把明文注入 DOM，
  // 此时新出现的 .mermaid 不在初始 nodes 快照里 → 需补渲染一次。
  // 注意：该插件用 window.dispatchEvent(new CustomEvent('hexo-blog-decrypt'))
  // 派发（实测 v4.1.0），故必须监听 window；document 上冗余保留以兼容旧版。
  const rerenderMermaid = () => {
    const pending = Array.from(document.querySelectorAll('.mermaid:not([data-processed])'));
    if (pending.length) {
      mermaid.run({ nodes: pending }).catch(() => {});
    }
  };
  window.addEventListener('hexo-blog-decrypt', rerenderMermaid);
  document.addEventListener('hexo-blog-decrypt', rerenderMermaid);

</script>

/**
 * 设置精度定时器
 * @param {function} 回调函数
 * @param {number}   延迟时间
 * @return {number}  定时器ID
 */
 function setIntervalPrecision(callback, delay) {
  // 生成并记录定时器ID
  let obj = window.interValPrecisionObj || (window.interValPrecisionObj = { num: 0 })
  obj.num++
  obj['n' + obj.num] = true
  var intervalId = obj.num
  // 开始时间
  var startTime = +new Date()
  // 已执行次数
  var count = 0
  // 延迟时间
  delay = delay || 0


  ;(function loop() {
    // 定时器被清除，则终止
    if (!obj['n' + intervalId]) return

    // 满足条件执行回调
    if (+new Date() > startTime + delay * (count + 1)) {
      count++
      callback(count)
    }

    window.requestAnimationFrame(loop)
  })()

  return intervalId
}

/**
 * 清除精度定时器
 * @param {number} 定时器ID
 */
function clearIntervalPrecision(intervalId) {
  if (window.interValPrecisionObj) {
    window.cancelAnimationFrame('n' + intervalId)
    delete window.interValPrecisionObj['n' + intervalId]
  }
}
