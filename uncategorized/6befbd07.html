<script type="module">
  let mermaid;

  catch (e) { console.warn("[asset-fallback] CDN failed, using local:", "/js/mermaid.js"); mermaid = (await import("/js/mermaid.js")).default; }
  let theme = localStorage.getItem("s");
  mermaid.initialize({
      startOnLoad: true,

    });
  let mode = document.getElementById("dark-mode");
   let arrayGraphs =  [];
  let nodes = document.getElementsByClassName('mermaid')
  for(let n of nodes){
    console.log(n.innerHTML)
    arrayGraphs.push(n.innerHTML);
  }

  mode.addEventListener("click",async ()=>{
    theme = localStorage.getItem("s");
    mermaid.initialize({
      startOnLoad: true,
      logLevel: 'debug',
      theme: theme === '2' ? 'forest' : 'dark',
    });
  for(let i = 0;i< nodes.length;i++){

      // console.log(n.innerHTML)
      let id = `mermaid-${i}`
      n.removeAttribute("data-processed");
      n.setAttribute("id",`mermaid-${i}`)
      n.replaceChildren();
      n.innerHTML = arrayGraphs[i]
      mermaid.init(undefined,n)
    }
  },false);

</script>

/***
 * 兼容不支持requestAnimationFrame的浏览器
 ***/
window.requestAnimationFrame = (function () {
  return window.requestAnimationFrame ||
    window.webkitRequestAnimationFrame ||/* Safari 和 Chrome */
    window.mozRequestAnimationFrame ||/* Firefox */
    window.oRequestAnimationFrame      ||/* Opera */
    window.msRequestAnimationFrame     ||/* IE 9 */
    function (callback) {
      window.setTimeout(callback, 6000 / 60)
    }
})();
window.cancelAnimationFrame = (function () {
  return window.cancelAnimationFrame ||
    window.webkitCancelAnimationFrame ||
    window.mozCancelAnimationFrame ||
    window.oCancelAnimationFrame ||
    window.msCancelAnimationFrame || clearTimeout
})();
</script>

function get_poem(poem_ele, info_ele) {
    var poem = document.querySelector(poem_ele);
    var info = document.querySelector(info_ele);
    var xhr = new XMLHttpRequest();
    xhr.open('get', 'https://v2.jinrishici.com/one.json?client=browser-sdk/1.2');
    xhr.withCredentials = true;
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            var data = JSON.parse(xhr.responseText);
            poem.innerHTML = data.data.content;
            info.innerHTML = '[' + data.data.origin.dynasty + '] ' + data.data.origin.author + '《' + data.data.origin.title + '》';
        }
    };
    xhr.send();
}

function loopHover(){
  var list = $('.tagcloud a');
  var hover = $('.tagcloud a[class="tag-hover"]')
  var next = Math.round(Math.random() * (list.length  - 1))

  if(next < 0){
    next = 0
  }

  if(next > list.length){
    next = list.length - 1
  }
  if(list.length){
    if(hover.length){
      for(let i = 0;i< hover.length;i++){
        hover[i].classList = ''
      }
    }
    list[next].classList = 'tag-hover'
  }
}

/**
 * 设置精度定时器
 * @param {function} 回调函数
 * @param {number}   延迟时间
 * @return {number}  定时器ID
 */
 function setIntervalPrecision(callback, delay) {
  // 生成并记录定时器ID
  let obj = window.interValPrecisionObj || (window.interValPrecisionObj = { num: 0 })
  obj.num++
  obj['n' + obj.num] = true
  var intervalId = obj.num
  // 开始时间
  var startTime = +new Date()
  // 已执行次数
  var count = 0
  // 延迟时间
  delay = delay || 0


  ;(function loop() {
    // 定时器被清除，则终止
    if (!obj['n' + intervalId]) return

    // 满足条件执行回调
    if (+new Date() > startTime + delay * (count + 1)) {
      count++
      callback(count)
    }

    window.requestAnimationFrame(loop)
  })()

  return intervalId
}

/**
 * 清除精度定时器
 * @param {number} 定时器ID
 */
function clearIntervalPrecision(intervalId) {
  if (window.interValPrecisionObj) {
    window.cancelAnimationFrame('n' + intervalId)
    delete window.interValPrecisionObj['n' + intervalId]
  }
}

setIntervalPrecision(loopHover, 250)
