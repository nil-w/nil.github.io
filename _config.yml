# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
# title: Viva La Vida
# subtitle: "Viva La Vida"
# description: "生命万岁"
# keywords: 生命,生命万岁,Viva,Viva La Vida
title: Nil W
subtitle: "生命万岁"
description: "技术｜思考｜生活。一个独立开发者的持续输出频道。"
keywords: 技术博客,独立开发,编程,效率工具,AI,生命万岁
# Twitter handle（GitHub 账号已改名 nil-w，主题里硬编码的 @yqwoe 由 scripts/seo-head.js 改写）
twitter: "@nil-w"
author: Nil W
language: zh-CN
timezone: ""

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

all_minifier: false

search:
  enable: true
  path: search.xml
  field: post
  format: html
  limit: 10000
  content: true

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://nilw.rm-rf.ink
root: /
# permalink: posts/:year/:month/:day/:title/
permalink: :category/:abbrlink.html
abbrlink:
  alg: crc32 #算法： crc16(default) and crc32
  rep: hex #进制： dec(default) and hex
# permalink_defaults:
# pretty_urls:
#   trailing_index: false # Set to false to remove trailing 'index.html' from permalinks
#   trailing_html: false # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
# tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  eauto_detect: false
  line_number: false
  line_threshold: 0
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: false
  line_threshold: 0
  tab_replace: ''
# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY.MM.DD  HH:mm A
time_format: HH:mm:ss
## Use post's date for updated date unless set in front-matter
use_date_for_updated: true

# Pagination
## Set per_page to 0 to disable pagination
index_generator:
  path: ""
  per_page: 10
  order_by: -date

archive_generator:
  per_page: 100000000
  yearly: true
  monthly: true

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:
aplayer:
  meting: true
sitemap:
  path: sitemap.xml
  template: ./sitemap_template.xml
  prettyURLs:
    trailingSlash: false
baidusitemap:
  path: baidusitemap.xml
  prettyURLs:
    trailingSlash: false

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: ascent

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  - type: git
    repo: git@github.com:nil-w/nil.github.io.git
    branch: master

favicon:
  small: /images/favicon.ico
  medium: /images/favicon.ico
  apple_touch_icon: /images/favicon.ico
  safari_pinned_tab: /images/favicon.ico
