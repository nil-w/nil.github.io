<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第三集：Prompt · Thinking · Function Calling 到底在干什么</title>
<style>
  html,body{margin:0;height:100%;background:#07090e;overflow:hidden;}
  canvas{display:block;cursor:pointer;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
"use strict";

const VW=1600, VH=900;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let scale=1, offX=0, offY=0, dpr=1;

const FONT='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif';
const MONO='Menlo,Consolas,"SF Mono",monospace';

const BG='#0a0d14', PANEL='#121824', PANEL2='#18212e', LINE='#2a3646',
      TXT='#e8eef8', DIM='#8a97a9', CYAN='#3ecde0', ORANGE='#ff9c42',
      PURPLE='#9c7eff', GREEN='#5cd692', PINK='#ff6c96', YELLOW='#f5d76e';

const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const cl01=x=>clamp(x,0,1);
const seg=(t,a,b)=>b<=a?(t>=b?1:0):cl01((t-a)/(b-a));
const eo=t=>1-Math.pow(1-cl01(t),3);
const lerp=(a,b,t)=>a+(b-a)*t;
function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mixc(c1,c2,t){const a=hex2rgb(c1),b=hex2rgb(c2);t=cl01(t);
  return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';}
function rgba(c,a){const r=hex2rgb(c);return 'rgba('+r[0]+','+r[1]+','+r[2]+','+cl01(a)+')';}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function T(s,x,y,size,color,align,weight,alpha){
  ctx.save();ctx.globalAlpha=alpha===undefined?1:cl01(alpha);
  ctx.fillStyle=color;ctx.font=(weight||400)+' '+size+'px '+FONT;
  ctx.textAlign=align||'left';ctx.textBaseline='middle';
  ctx.fillText(s,x,y);ctx.restore();
}
function box(x,y,w,h,fill,stroke,r,lw,alpha){
  ctx.save();ctx.globalAlpha=alpha===undefined?1:cl01(alpha);
  rr(x,y,w,h,r===undefined?12:r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.stroke();}
  ctx.restore();
}
function arrow(x1,y1,x2,y2,color,lw,alpha,head){
  ctx.save();ctx.globalAlpha=alpha===undefined?1:cl01(alpha);
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=lw||2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  if(head!==false){
    const ang=Math.atan2(y2-y1,x2-x1), L=9;
    ctx.beginPath();ctx.moveTo(x2,y2);
    ctx.lineTo(x2-L*Math.cos(ang-0.4),y2-L*Math.sin(ang-0.4));
    ctx.lineTo(x2-L*Math.cos(ang+0.4),y2-L*Math.sin(ang+0.4));
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function badge(n,x,y,r,color,a){
  ctx.save();ctx.globalAlpha=a===undefined?1:cl01(a);
  ctx.fillStyle=rgba(color,0.18);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=rgba(color,0.95);ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=color;ctx.font='700 '+Math.round(r*1.15)+'px '+FONT;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,x,y+1);
  ctx.restore();
}

/* ================= S0 ================= */
function S0(t){
  const a1=eo(seg(t,0.1,1.0)), a2=eo(seg(t,0.7,1.6)), a3=eo(seg(t,1.4,2.3));
  const g=ctx.createRadialGradient(VW/2,VH/2-40,40,VW/2,VH/2-40,660);
  g.addColorStop(0,'rgba(92,214,146,0.12)');g.addColorStop(1,'rgba(92,214,146,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);

  T('第三集',VW/2,VH/2-186,22,GREEN,'center',700,a1);
  T('它到底怎么被"指挥"的',VW/2,VH/2-100,70,TXT,'center',700,a1);
  T('Prompt · Thinking · Function Calling 三块拼图',VW/2,VH/2-10,30,CYAN,'center',400,a2);

  const items=[['Prompt','你给它看什么',CYAN],['Thinking','它想几步再答',PURPLE],['Function Calling','它能动手做什么',ORANGE]];
  for(let i=0;i<3;i++){
    const a=eo(seg(t,1.5+i*0.35,1.9+i*0.35));
    const x=VW/2-450+i*310;
    box(x,VH/2+70,280,84,mixc(BG,PANEL2,0.7),rgba(items[i][2],0.75*a),12,1.8,a);
    T(items[i][0],x+140,VH/2+102,22,items[i][2],'center',700,a);
    T(items[i][1],x+140,VH/2+134,15,TXT,'center',400,a*0.9);
  }
  T('这三件事，其实是一条链上的三段',VW/2,VH/2+210,20,DIM,'center',400,a3*0.95);
}

/* ================= S1 Prompt 本质 ================= */
function S1(t){
  T('Prompt 不是咒语，是「把它的注意力拨过去」',140,86,40,TXT,'left',700,eo(seg(t,0,0.4)));
  T('你写的每个词，都会变成它在上下文里重点盯住的地方',140,136,22,DIM,'left',400,eo(seg(t,0.2,0.7)));

  // 左：prompt 文本
  const a0=eo(seg(t,0.3,0.9));
  box(140,186,760,180,mixc(BG,PANEL2,0.55),rgba(LINE,0.9*a0),14,1.5,a0);
  T('你写的 prompt',166,214,14,DIM,'left',500,a0);

  const parts=[
    ['你是资深法务。',CYAN,0.9],
    ['请逐条核对合同里的风险点，',PURPLE,1.5],
    ['只输出一张表格，不要解释。',ORANGE,2.1]
  ];
  // 三行文本，关键词脉冲高亮
  const lines=['你是资深法务。','请逐条核对合同里的风险点，','只输出一张表格，不要解释。'];
  for(let i=0;i<3;i++){
    const a=eo(seg(t,0.5+i*0.35,0.9+i*0.35));
    const pulse=0.5+0.5*Math.sin(t*2.2-i*0.7);
    const hl=eo(seg(t,parts[i][2],parts[i][2]+0.5));
    if(hl>0){
      ctx.save();ctx.globalAlpha=a*hl*(0.10+0.10*pulse);
      ctx.fillStyle=parts[i][1];
      rr(160,238+i*44-16,400,32,6);ctx.fill();ctx.restore();
    }
    T(lines[i],166,238+i*44,21,hl>0.4?parts[i][1]:TXT,'left',600,a);
  }

  // 右：注意力条
  const a1=eo(seg(t,1.2,1.8));
  T('它内部的注意力被拨到哪儿了',940,214,14,DIM,'left',500,a1);
  const bars=[
    ['「资深法务」→ 调用法律知识',0.86,CYAN,0.9],
    ['「逐条核对」→ 一条条展开',0.72,PURPLE,1.5],
    ['「只输出表格」→ 输出走表格',0.64,ORANGE,2.1]
  ];
  for(let i=0;i<3;i++){
    const a=eo(seg(t,bars[i][3],bars[i][3]+0.5));
    if(a<=0)continue;
    const y=248+i*50;
    T(bars[i][0],940,y-12,13,DIM,'left',400,a*0.9);
    box(940,y+2,470,14,'#141c27',null,7,0,a);
    const w=470*bars[i][1]*(0.75+0.25*Math.sin(t*2.6+i));
    box(940,y+2,Math.max(6,w),14,mixc(PANEL,bars[i][2],0.85),null,7,0,a);
    T(Math.round(bars[i][1]*100)+'%',1426,y+9,13,bars[i][2],'right',700,a);
  }

  // 下方三卡
  const cards=[
    ['身份句 → 换脑子','告诉它「这件事该调用哪一块知识」。\n同一句话，法务身份和程序员身份，答案完全不同。',CYAN],
    ['动作句 → 换做法','说的是「做什么类型的活」：核对、总结、翻译、\n挑错。用动词，别用形容词。',PURPLE],
    ['格式句 → 卡形状','把输出概率往某个形状上推：表格、JSON、\n不超过 100 字。这一句最省钱最有效。',ORANGE]
  ];
  for(let i=0;i<3;i++){
    const st=2.6+i*0.45, a=eo(seg(t,st,st+0.45));
    if(a<=0)continue;
    const x=140+i*434;
    box(x,410,394,196,mixc(BG,PANEL2,0.6),mixc(LINE,cards[i][2],0.5*a),14,1.6,a);
    T(cards[i][0],x+24,448,20,cards[i][2],'left',700,a);
    const ls=cards[i][1].split('\n');
    for(let j=0;j<ls.length;j++)T(ls[j],x+24,492+j*30,15,TXT,'left',400,a*0.92);
  }

  const b=eo(seg(t,4.4,5.0));
  if(b>0){
    box(140,640,1260,86,PANEL,mixc(LINE,GREEN,0.5),12,1.7,b);
    T('换个说法',176,683,18,GREEN,'left',700,b);
    T('Prompt 不是在对模型下命令 —— 模型不会「服从」，它只是改了你给它的上下文，于是它接下去写的字就变了。',400,683,17,TXT,'left',400,b);
  }
  const c=eo(seg(t,5.4,6.0));
  T('所谓「提示词工程」，本质就是：设计上下文，让它的注意力落在你要的地方。',140,764,17,DIM,'left',400,c*0.95);
}

/* ================= S2 消息怎么拼 ================= */
const MSGS=[
  ['system','你是一个严谨的助手，\n只回答有依据的内容。',CYAN],
  ['user','帮我算一下这个月的\n服务器开销。',PURPLE],
  ['assistant','好的，我需要先拿到\n账单数据。',ORANGE],
  ['tool','{ "总费用": 1240 }',GREEN]
];
function S2(t){
  T('你发的"消息"，其实会被拼成一整段文字',140,86,40,TXT,'left',700,eo(seg(t,0,0.4)));
  T('模型是"无状态"的：它不记得上一次聊天，所以每次都得把全部历史重新发一遍',140,136,21,DIM,'left',400,eo(seg(t,0.2,0.7)));

  // 四个气泡
  const bw=300,bh=118,bgp=20,x0=140;
  for(let i=0;i<4;i++){
    const st=0.3+i*0.4, a=eo(seg(t,st,st+0.4));
    if(a<=0)continue;
    const x=x0+i*(bw+bgp);
    box(x,200,bw,bh,mixc(BG,PANEL2,0.6),rgba(MSGS[i][2],0.8*a),12,1.6,a);
    T('<'+MSGS[i][0]+'>',x+18,226,13,MSGS[i][2],'left',700,a);
    const ls=MSGS[i][1].split('\n');
    for(let j=0;j<ls.length;j++)T(ls[j],x+18,258+j*24,15,TXT,'left',400,a*0.92);
  }

  // 拼接箭头
  const a1=eo(seg(t,2.0,2.6));
  if(a1>0){
    T('拼起来 ↓',140,346,15,DIM,'left',600,a1);
  }

  // 拼成长串
  const segs=[[0.16,CYAN,'system'],[0.22,PURPLE,'user'],[0.24,ORANGE,'assistant'],[0.18,GREEN,'tool'],[0.14,DIM,'再问']];
  let cx=140;
  const totalW=1260;
  for(let i=0;i<segs.length;i++){
    const st=2.4+i*0.3, a=eo(seg(t,st,st+0.3));
    if(a<=0)continue;
    const w=totalW*segs[i][0];
    box(cx,376,w,70,mixc(BG,segs[i][1],0.22*a),rgba(segs[i][1],0.85*a),8,1.4,a);
    T(segs[i][2],cx+w/2,411,13,TXT,'center',600,a);
    cx+=w;
    if(i<segs.length-1){
      T('|',cx,411,16,rgba(segs[i][1],0.8),'center',700,a);
    }
  }
  const a2=eo(seg(t,3.8,4.4));
  T('每一次请求，这一整条都要重新算一遍 —— 这就是为什么聊得越久越慢、越贵',140,470,17,YELLOW,'left',600,a2*0.95);

  // 三个要点
  const cards=[
    ['特殊标记分隔','<system> <user> <assistant>\n靠这些标记区分「谁说的」',CYAN],
    ['顺序就是权重','放在最后的指令，通常\n比开头的更被重视',PURPLE],
    ['越长越贵','输入按 token 计费，\n历史越长，每轮都更贵',ORANGE]
  ];
  for(let i=0;i<3;i++){
    const st=4.4+i*0.45, a=eo(seg(t,st,st+0.45));
    if(a<=0)continue;
    const x=140+i*434;
    box(x,520,394,190,mixc(BG,PANEL2,0.6),mixc(LINE,cards[i][2],0.5*a),14,1.6,a);
    T(cards[i][0],x+24,556,19,cards[i][2],'left',700,a);
    const ls=cards[i][1].split('\n');
    for(let j=0;j<ls.length;j++)T(ls[j],x+24,598+j*28,15,TXT,'left',400,a*0.92);
  }
  const b=eo(seg(t,6.0,6.6));
  T('实用结论：长对话要主动「总结压缩」，别指望它记得住几十轮之前的细节。',140,752,17,DIM,'left',400,b*0.95);
}

/* ================= S3 Function Calling ================= */
function S3(t){
  T('Function Calling：它其实一次都没执行过代码',140,86,40,TXT,'left',700,eo(seg(t,0,0.4)));
  T('模型唯一会做的事是「写字」。所谓调工具，是它把「要调什么」写出来了',140,136,21,DIM,'left',400,eo(seg(t,0.2,0.7)));

  // 左：工具说明书
  const a0=eo(seg(t,0.4,0.9));
  box(140,200,400,290,mixc(BG,PANEL2,0.55),rgba(CYAN,0.5*a0),14,1.5,a0);
  T('① 你先给一份「说明书」',164,232,16,CYAN,'left',700,a0);
  const defs=[
    '{',
    '  "name": "查天气",',
    '  "desc": "查某城市天气",',
    '  "参数": {',
    '    "city": "城市名"',
    '  }',
    '}'
  ];
  for(let i=0;i<defs.length;i++){
    const a=eo(seg(t,0.6+i*0.12,0.9+i*0.12));
    T(defs[i],168,268+i*30,14,i===1||i===2?CYAN:TXT,'left',400,a*0.95);
  }

  // 中：模型
  const a1=eo(seg(t,2.0,2.6));
  const mc=800,mcy=345;
  if(a1>0){
    ctx.save();ctx.globalAlpha=a1*0.12;ctx.fillStyle=PURPLE;
    ctx.beginPath();ctx.arc(mc,mcy,96,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.save();ctx.globalAlpha=a1*0.85;ctx.strokeStyle=rgba(PURPLE,0.9);
    ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(mc,mcy,96,0,Math.PI*2);ctx.stroke();ctx.restore();
    T('模型',mc,mcy-14,26,TXT,'center',700,a1);
    T('只会写字',mc,mcy+22,15,DIM,'center',400,a1);
  }
  const a2=eo(seg(t,1.0,1.6));
  arrow(556,320,mc-108,320,rgba(CYAN,0.9),2.5,a2);
  T('说明书随请求一起发过去',572,298,13,CYAN,'left',600,a2*0.95);
  arrow(mc+108,320,1036,320,rgba(ORANGE,0.9),2.5,eo(seg(t,2.4,3.0)));
  T('它输出一段结构化文字',mc+120,298,13,ORANGE,'left',600,eo(seg(t,2.6,3.2))*0.95);

  // 右：输出
  const a3=eo(seg(t,2.6,3.2));
  if(a3>0){
    box(1044,200,420,290,mixc(BG,PANEL2,0.55),rgba(ORANGE,0.55*a3),14,1.5,a3);
    T('② 它写出这么一段',1068,232,16,ORANGE,'left',700,a3);
    const out=[
      '{',
      '  "name": "查天气",',
      '  "arguments": {',
      '    "city": "郑州"',
      '  }',
      '}'
    ];
    for(let i=0;i<out.length;i++){
      const a=eo(seg(t,2.8+i*0.12,3.1+i*0.12));
      T(out[i],1092,268+i*30,14,i===1?ORANGE:TXT,'left',400,a*0.95);
    }
  }

  // 中下部：关键说明
  const b0=eo(seg(t,4.2,4.8));
  if(b0>0){
    box(140,530,1260,104,mixc(BG,PINK,0.10),rgba(PINK,0.8*b0),14,2.2,b0);
    T('划重点',176,570,18,PINK,'left',700,b0);
    T('到这一步为止，模型什么都没执行。它只是生成了一串字符，长得像指令而已。',340,570,20,TXT,'left',600,b0);
    T('真正去查天气的，是你写在程序里的代码 —— 执行的永远是你，不是它。',340,608,18,DIM,'left',400,b0*0.95);
  }

  // 三个要点
  const pts=[
    ['说明书就是 prompt','"desc" 写得含糊，它就挑错工具。\n这是最常见的故障来源。',CYAN],
    ['参数容易编','你没给范围，它可能编一个不存在的城市。\n枚举、格式、例子，都要写死。',ORANGE],
    ['工具别给太多','一次给 30 个工具，选错的概率直线上升。\n按场景分组，别全塞。',PURPLE]
  ];
  for(let i=0;i<3;i++){
    const st=5.2+i*0.45, a=eo(seg(t,st,st+0.45));
    if(a<=0)continue;
    const x=140+i*434;
    box(x,660,394,180,mixc(BG,PANEL2,0.55),mixc(LINE,pts[i][2],0.5*a),12,1.5,a);
    T(pts[i][0],x+22,696,18,pts[i][2],'left',700,a);
    const ls=pts[i][1].split('\n');
    for(let j=0;j<ls.length;j++)T(ls[j],x+22,734+j*26,14,TXT,'left',400,a*0.9);
  }
}

/* ================= S4 完整回路 ================= */
function S4(t){
  T('完整的一次工具调用，是这样转的',140,86,40,TXT,'left',700,eo(seg(t,0,0.4)));
  T('四步，两次调用模型',140,136,21,DIM,'left',400,eo(seg(t,0.2,0.7)));

  // 左框：你的程序
  const a0=eo(seg(t,0.4,0.9));
  box(140,210,360,400,mixc(BG,PANEL2,0.55),rgba(CYAN,0.55*a0),16,1.8,a0);
  T('你的程序',168,246,22,CYAN,'left',700,a0);
  T('（这里才是真正干活的地方）',168,278,14,DIM,'left',400,a0*0.9);
  const p1=['· 拼消息列表','· 发请求','· 解析 JSON','· 查数据库 / 调接口','· 把结果写回消息'];
  for(let i=0;i<p1.length;i++){
    const a=eo(seg(t,0.6+i*0.15,0.9+i*0.15));
    T(p1[i],176,330+i*40,16,TXT,'left',400,a*0.92);
  }

  // 右框：模型
  const a1=eo(seg(t,0.6,1.1));
  box(1100,210,360,400,mixc(BG,PANEL2,0.55),rgba(PURPLE,0.55*a1),16,1.8,a1);
  T('模型',1128,246,22,PURPLE,'left',700,a1);
  T('（只会读上下文、写字）',1128,278,14,DIM,'left',400,a1*0.9);
  const p2=['· 读全部消息','· 决定：答还是调工具','· 输出文字或 JSON','· 不保存任何记忆'];
  for(let i=0;i<p2.length;i++){
    const a=eo(seg(t,0.8+i*0.15,1.1+i*0.15));
    T(p2[i],1136,330+i*40,16,TXT,'left',400,a*0.92);
  }

  // 四条弧线

    acc+=SCENES[i].d;
  }
  return {i:SCENES.length-1,t:SCENES[SCENES.length-1].d};
}

function drawTopHUD(idx){
  T('Prompt · Thinking · Function Calling',44,34,15,DIM,'left',600,1);
  T('/ '+SCENES[idx].n,320,34,15,GREEN,'left',600,1);
}

function drawProgress(g){
  const y=VH-8;
  ctx.fillStyle='rgba(40,52,68,0.9)';ctx.fillRect(0,y,VW,3);
  ctx.fillStyle=GREEN;ctx.fillRect(0,y,VW*(g/TOTAL),3);
  let acc=0;
  for(let i=0;i<SCENES.length;i++){
    const x=VW*(acc/TOTAL);
    ctx.fillStyle=BG;ctx.fillRect(x-1,y-3,2,9);
    acc+=SCENES[i].d;
  }
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=BG;ctx.fillRect(0,0,cv.width/dpr,cv.height/dpr);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,offX*dpr,offY*dpr);

  const loc=locate(clock);
  const sc=SCENES[loc.i];
  const fin=cl01(loc.t/0.42), fout=cl01((sc.d-loc.t)/0.34);
  const alpha=Math.min(fin,fout);

  ctx.save();ctx.globalAlpha=alpha;sc.f(loc.t);ctx.restore();
  drawTopHUD(loc.i);
  drawProgress(clock);
}

function loop(ts){
  if(!last)last=ts;
  let dt=(ts-last)/1000;last=ts;
  if(dt>0.12)dt=0.12;
  if(playing){clock+=dt;if(clock>=TOTAL)clock=0;}
  render();
  requestAnimationFrame(loop);
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const w=window.innerWidth,h=window.innerHeight;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  cv.style.width=w+'px';cv.style.height=h+'px';
  scale=Math.min(w/VW,h/VH);
  offX=(w-VW*scale)/2;offY=(h-VH*scale)/2;
}
window.addEventListener('resize',resize);

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();playing=!playing;last=0;}
  else if(e.code==='ArrowRight'||e.code==='ArrowLeft'){
    const loc=locate(clock);
    let target=e.code==='ArrowRight'?Math.min(loc.i+1,SCENES.length-1):Math.max(loc.i-1,0);
    let acc=0;
    for(let i=0;i<SCENES.length;i++){if(i===target){clock=acc;break;}acc+=SCENES[i].d;}
    last=0;
  } else if(e.key==='r'||e.key==='R'){clock=0;last=0;playing=true;}
});

cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  const w=r.width,h=r.height;
  const s=Math.min(w/VW,h/VH);
  const ox=(w-VW*s)/2, oy=(h-VH*s)/2;
  const vx=(e.clientX-r.left-ox)/s, vy=(e.clientY-r.top-oy)/s;
  if(vy>VH-24){clock=cl01(vx/VW)*TOTAL;last=0;}
  else {playing=!playing;last=0;}
});

try{
  const qp=new URLSearchParams(location.search);
  if(qp.has('t')){
    const v=parseFloat(qp.get('t'));
    if(!isNaN(v))clock=Math.max(0,Math.min(TOTAL-0.04,v));
  }
  if(qp.get('pause')==='1')playing=false;
}catch(err){}

resize();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
