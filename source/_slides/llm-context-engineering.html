<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第四集：上下文工程 &amp; Agent 可靠性</title>
<style>
  html,body{margin:0;height:100%;background:#07080f;overflow:hidden;}
  canvas{display:block;cursor:pointer;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
"use strict";

const VW=1600, VH=900;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let scale=1, offX=0, offY=0, dpr=1;

const FONT='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif';

const BG='#080b12', PANEL='#101724', PANEL2='#161f2e', LINE='#28344a',
      TXT='#e8eef8', DIM='#8a97a9',
      BLUE='#4a8df0', TEAL='#2fc4b2', AMBER='#f2b34c',
      ROSE='#f2617a', VIOLET='#8f7bef', GREEN='#5cd692';

const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const cl01=x=>clamp(x,0,1);
const seg=(t,a,b)=>b<=a?(t>=b?1:0):cl01((t-a)/(b-a));
const eo=t=>1-Math.pow(1-cl01(t),3);
const eio=t=>{t=cl01(t);return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
const lerp=(a,b,t)=>a+(b-a)*t;
function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mixc(c1,c2,t){const a=hex2rgb(c1),b=hex2rgb(c2);t=cl01(t);
  return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';}
function rgba(c,a){const r=hex2rgb(c);return 'rgba('+r[0]+','+r[1]+','+r[2]+','+cl01(a)+')';}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function T(s,x,y,size,color,align,weight,alpha){
  ctx.save();ctx.globalAlpha=alpha===undefined?1:cl01(alpha);
  ctx.fillStyle=color;ctx.font=(weight||400)+' '+size+'px '+FONT;
  ctx.textAlign=align||'left';ctx.textBaseline='middle';
  ctx.fillText(s,x,y);ctx.restore();
}
function box(x,y,w,h,fill,stroke,r,lw,alpha){
  ctx.save();ctx.globalAlpha=alpha===undefined?1:cl01(alpha);
  rr(x,y,w,h,r===undefined?12:r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.stroke();}
  ctx.restore();
}
function arrow(x1,y1,x2,y2,color,lw,alpha,head){
  ctx.save();ctx.globalAlpha=alpha===undefined?1:cl01(alpha);
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=lw||2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  if(head!==false){
    const ang=Math.atan2(y2-y1,x2-x1), L=9;
    ctx.beginPath();ctx.moveTo(x2,y2);
    ctx.lineTo(x2-L*Math.cos(ang-0.4),y2-L*Math.sin(ang-0.4));
    ctx.lineTo(x2-L*Math.cos(ang+0.4),y2-L*Math.sin(ang+0.4));
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function badge(n,x,y,r,color,a){
  ctx.save();ctx.globalAlpha=a===undefined?1:cl01(a);
  ctx.fillStyle=rgba(color,0.18);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=rgba(color,0.95);ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=color;ctx.font='700 '+Math.round(r*1.12)+'px '+FONT;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,x,y+1);
  ctx.restore();
}
function dot(x,y,r,color,a){
  ctx.save();ctx.globalAlpha=a===undefined?1:cl01(a);
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
}

/* ================= S0 开场 ================= */
function S0(t){
  const a1=eo(seg(t,0.1,1.0)), a2=eo(seg(t,0.7,1.6)), a3=eo(seg(t,1.4,2.3));
  const g=ctx.createRadialGradient(VW/2,VH/2-30,40,VW/2,VH/2-30,660);
  g.addColorStop(0,'rgba(74,141,240,0.14)');g.addColorStop(1,'rgba(74,141,240,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);

  T('第四集',VW/2,VH/2-186,22,BLUE,'center',700,a1);
  T('让它稳定干活的那些事',VW/2,VH/2-96,64,TXT,'center',700,a1);
  T('上下文工程  ·  Agent 可靠性',VW/2,VH/2-6,30,TEAL,'center',400,a2);
  T('前三集讲它怎么工作，这一集讲你怎么让它不出事',VW/2,VH/2+46,20,DIM,'center',400,a2*0.9);

  const items=[['放什么','该给它的和不该给的',TEAL],['放多少','预算怎么分才够用',BLUE],['按什么序','位置决定它看不看得见',VIOLET],['何时清','压缩与遗忘的时机',AMBER]];
  for(let i=0;i<4;i++){
    const a=eo(seg(t,1.5+i*0.3,1.9+i*0.3));
    const w=256,gp=22,total=4*w+3*gp,x=VW/2-total/2+i*(w+gp);
    box(x,VH/2+96,w,80,mixc(BG,PANEL2,0.6),rgba(items[i][2],0.7*a),12,1.6,a);
    T(items[i][0],x+w/2,VH/2+126,19,items[i][2],'center',700,a);
    T(items[i][1],x+w/2,VH/2+154,13,DIM,'center',400,a*0.9);
  }
  T('不需要换更强的模型，也能让成功率涨一大截',VW/2,VH/2+230,18,DIM,'center',400,a3*0.9);
}

/* ================= S1 桌面比喻 ================= */
const PAPERS=[
  [0,'系统规则',TEAL],[1,'用户问题',AMBER],[2,'工具结果',VIOLET],[3,'参考资料',BLUE],
  [4,'',DIM],[5,'',DIM],[6,'',DIM],[7,'',DIM],[8,'',DIM],[9,'',DIM],
  [10,'',DIM],[11,'',DIM],[12,'',DIM],[13,'',DIM],[14,'',DIM]
];
function S1(t){
  T('上下文是「桌面」，不是「硬盘」',200,86,40,TXT,'left',700,eo(seg(t,0,0.4)));
  T('模型只看得见桌上摊着的东西 —— 你放什么它就想什么，你没放它当不存在',200,136,21,DIM,'left',400,eo(seg(t,0.2,0.7)));

  // 桌面
  const a0=eo(seg(t,0.3,0.9));
  box(200,196,1200,336,mixc(BG,PANEL2,0.5),rgba(BLUE,0.45*a0),18,1.8,a0);
  T('你的上下文窗口',224,220,13,DIM,'left',600,a0*0.9);

  // 统计已出现张数
  let n=0;
  for(let i=0;i<PAPERS.length;i++){
    let st;
    if(i<4) st=0.6+i*0.32; else st=4.0+(i-4)*0.42;
    if(t>=st) n=i+1;
  }
  const crowd=eo(seg(t,4.0,9.2));
  const sc=lerp(1,0.66,crowd);
  const al=lerp(1,0.5,crowd);

  for(let i=0;i<PAPERS.length;i++){
    let st;
    if(i<4) st=0.6+i*0.32; else st=4.0+(i-4)*0.42;
    const a=eo(seg(t,st,st+0.32));
    if(a<=0)continue;
    const col=i%4, row=Math.floor(i/4);
    const cx=252+col*288, cy=252+row*74;
    const w=264*sc, h=62*sc;
    const x=cx+(264-w)/2, y=cy+(62-h)/2;
    const isNoise=PAPERS[i][1]==='';
    const c=PAPERS[i][2];
    box(x,y,w,h,
        isNoise?rgba(PANEL,0.85*al*a):mixc(PANEL,c,0.16*al*a),
        isNoise?rgba(LINE,0.75*al*a):rgba(c,0.75*al*a),8,1.4,a*al);
    if(!isNoise)T(PAPERS[i][1],x+w/2,y+h/2,Math.round(15*sc),c,'center',600,a*al);
  }

  // 容量提示
  const a1=eo(seg(t,0.9,1.4));
  box(200,556,1200,18,'#131b28',null,9,0,a1);
  const ratio=n/15;
  const barC=ratio>0.78?ROSE:(ratio>0.5?AMBER:TEAL);
  const barA=eo(seg(t,0.9,1.6));
  box(200,556,Math.max(10,1200*ratio),18,mixc('#131b28',barC,0.9),null,9,0,barA);
  T('已占用 '+n+' / 15',200,600,15,barC,'left',700,Math.max(a1,barA));
  T(n<=4?'桌面很干净，重点清晰':'桌上东西越多，每一样就越小、越淡 —— 但总量没变',200,600,15,DIM,'right',400,eo(seg(t,2.4,3.0))*0.9);

  const a2=eo(seg(t,9.4,10.0));
  if(a2>0){
    box(200,626,1200,84,mixc(BG,ROSE,0.08),rgba(ROSE,0.75*a2),12,1.8,a2);
    T('关键认知',230,668,17,ROSE,'left',700,a2);
    T('塞得进去 ≠ 看得见。窗口够大不代表效果好 —— 无用的东西同样占地方，而且会稀释重点。',356,668,17,TXT,'left',500,a2);
  }
  const a3=eo(seg(t,10.4,11.0));
  T('所以上下文工程的第一原则：删，比加更重要。',200,762,17,DIM,'left',400,a3*0.95);
}

/* ================= S2 四层预算 ================= */
function S2(t){
  T('四层预算：谁在偷偷吃掉你的桌面',140,86,40,TXT,'left',700,eo(seg(t,0,0.4)));
  T('窗口是固定的，四个层次在抢同一块地 —— 谁涨，别人就得让',140,136,21,DIM,'left',400,eo(seg(t,0.2,0.7)));

  const LAYERS=[
    ['系统规则','身份 / 铁律 / 工具说明',TEAL],
    ['长期记忆','用户偏好 / 历史结论',VIOLET],
    ['会话历史','多轮对话记录',BLUE],
    ['当前任务','这次要干的活 + 工具结果',AMBER]
  ];
  const P1=[0.16,0.10,0.16,0.58];
  const P2=[0.16,0.10,0.44,0.30];
  const P3=[0.09,0.05,0.81,0.05];

  // 比例插值
  let p;
  if(t<2.6) p=P1;
  else if(t<4.6){const k=eio(seg(t,2.6,4.6));p=[0,1,2,3].map(i=>lerp(P1[i],P2[i],k));}
  else if(t<7.4){const k=eio(seg(t,4.6,7.4));p=[0,1,2,3].map(i=>lerp(P2[i],P3[i],k));}
  else p=P3;

  const a0=eo(seg(t,0.5,1.1));
  const BX=140,BW=1320,BY=206,BH=64;
  T('上下文窗口',BX,BY-22,14,DIM,'left',600,a0);
  box(BX,BY,BW,BH,'#111925',rgba(LINE,0.9*a0),12,1.4,a0);

  let cx=BX+2;
  const innerW=BW-4;
  for(let i=0;i<4;i++){
    const w=innerW*p[i];
    if(w>1){
      box(cx,BY+2,Math.max(2,w-2),BH-4,mixc(PANEL2,LAYERS[i][2],0.55),null,9,0,a0);
      if(w>92)T(Math.round(p[i]*100)+'%',cx+w/2,BY+BH/2,16,TXT,'center',700,a0*0.95);
    }
    cx+=w;
  }

  // 轮次标签
  let stage='第 1 轮';
  if(t>=7.4)stage='第 20 轮（从未压缩）';
  else if(t>=4.6)stage='第 8 轮';
  else if(t>=2.6)stage='第 3 轮';
  T(stage,BX+BW,BY-22,15,BLUE,'right',700,eo(seg(t,0.6,1.2)));

  // 四个说明卡
  for(let i=0;i<4;i++){
    const st=0.8+i*0.22, a=eo(seg(t,st,st+0.4));
    if(a<=0)continue;
    const w=318,gp=16,x=140+i*(w+gp);
    box(x,320,w,150,mixc(BG,PANEL2,0.55),mixc(LINE,LAYERS[i][2],0.55*a),12,1.5,a);
    dot(x+26,350,6,LAYERS[i][2],a);
    T(LAYERS[i][0],x+42,350,17,TXT,'left',700,a);
    T(LAYERS[i][1],x+20,384,13,DIM,'left',400,a*0.92);
    const now=Math.round(p[i]*100);
    T(now+'%',x+20,428,26,LAYERS[i][2],'left',700,a);
  }

  // 结果说明
  const a1=eo(seg(t,7.6,8.2));
  if(a1>0){
    box(140,500,1320,72,mixc(BG,ROSE,0.07),rgba(ROSE,0.65*a1),12,1.7,a1);
    T('看第 20 轮：当前任务只剩 5%',176,536,18,ROSE,'left',700,a1);
    T('历史吃掉了 81%，这次真正要做的事被挤成一条缝',560,536,18,TXT,'left',500,a1);
  }

  // 策略
  const rules=[
    ['规则层','恒定不动，永不被压缩。它是唯一必须保证 100% 在场的东西。',TEAL,8.4],
    ['记忆层','按需召回，不是全量塞。用的时候才取，取完就放回去。',VIOLET,9.0],
    ['历史层','唯一会无限增长的层 —— 所以压缩的唯一对象就是它。',BLUE,9.6],
    ['任务层','优先级最高。压缩时要保证它拿到最大的一块。',AMBER,10.2]
  ];
  for(let i=0;i<4;i++){
    const a=eo(seg(t,rules[i][3],rules[i][3]+0.45));
    if(a<=0)continue;
    const y=596+i*44;
    dot(158,y,5,rules[i][2],a);
    T(rules[i][0],176,y,16,rules[i][2],'left',700,a);
    T(rules[i][1],272,y,16,TXT,'left',400,a*0.92);
  }
  const a2=eo(seg(t,10.8,11.4));
  T('不压缩历史，就是把桌面让给昨天说过的话。',140,790,17,DIM,'left',400,a2*0.95);
}

/* ================= S3 压缩 ================= */
function S3(t){
  T('压缩：不是删掉历史，是把它折叠起来',140,86,40,TXT,'left',700,eo(seg(t,0,0.4)));
  T('留决定、留结论、留未完成；丢寒暄、丢试错、丢重复',140,136,21,DIM,'left',400,eo(seg(t,0.2,0.7)));

  // 左：消息堆
  const bx=140,bw=420;
  const a0=eo(seg(t,0.4,1.0));
  T('压缩前',bx,200,14,DIM,'left',600,a0);
  const msgs=[34,26,18,40,22,30,16,36,24,20];
  const collapse=eo(seg(t,3.0,5.4));
  for(let i=0;i<msgs.length;i++){
    const a=eo(seg(t,0.5+i*0.12,0.8+i*0.12))*a0;
    if(a<=0)continue;
    const h=msgs[i];
    const y=222+i*(h+6)-i*h*0.86*collapse;
    if(collapse>0.92)continue;
    box(bx,y,bw,h,mixc(PANEL,DIM,0.10),rgba(LINE,0.8*a*(1-collapse)),6,1.2,a*(1-collapse*0.9));
  }
  const a1=eo(seg(t,0.8,1.4));
  T('12,400 tokens',bx,222+10*(28+6)+14,17,ROSE,'left',700,a1*(1-collapse));

  // 中：压缩器
  const a2=eo(seg(t,2.6,3.2));
  const mx=636,my=396;
  if(a2>0){
    const pulse=0.5+0.5*Math.sin(t*3.2);
    ctx.save();ctx.globalAlpha=a2*(0.15+0.12*pulse);ctx.fillStyle=BLUE;
    ctx.beginPath();ctx.arc(mx,my,74,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.save();ctx.globalAlpha=a2*0.9;ctx.strokeStyle=rgba(BLUE,0.9);ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(mx,my,74,0,Math.PI*2);ctx.stroke();ctx.restore();
    T('压缩器',mx,my-12,20,TXT,'center',700,a2);
    T('每 8 轮 / 超 70%',mx,my+16,12,DIM,'center',500,a2);
  }
  arrow(580,320,mx-84,340,rgba(DIM,0.8),2.2,a2*0.9);
  arrow(mx+84,352,880,300,rgba(GREEN,0.9),2.2,eo(seg(t,4.2,4.8)));

  // 右：摘要
  const a3=eo(seg(t,4.4,5.0));
  if(a3>0){
    const rx=900,rw=560;
    T('压缩后',rx,200,14,DIM,'left',600,a3);
    box(rx,222,rw,158,mixc(PANEL,GREEN,0.10),rgba(GREEN,0.6*a3),12,1.6,a3);
    T('摘要（保留骨架）',rx+22,252,15,GREEN,'left',700,a3);
    const sum=['· 目标：把上月的对账流程自动化','· 已确定：走 A 方案，不用 B 方案','· 未完成：等财务确认税率口径'];
    for(let i=0;i<3;i++){
      const a=eo(seg(t,4.8+i*0.3,5.2+i*0.3));
      T(sum[i],rx+22,288+i*30,15,TXT,'left',400,a*0.92);
    }
    T('980 tokens',rx+rw-22,252,15,GREEN,'right',700,a3);
  }

  // 外部存储
  const a4=eo(seg(t,6.0,6.6));
  if(a4>0){
    const rx=900,rw=560;
    box(rx,404,rw,128,mixc(PANEL,VIOLET,0.10),rgba(VIOLET,0.6*a4),12,1.6,a4);
    T('外部存储（文件 / 数据库）',rx+22,434,15,VIOLET,'left',700,a4);
    T('完整对话原文存在这里，需要时再取回',rx+22,468,15,TXT,'left',400,a4*0.92);
    T('细节不丢，只是移出桌面',rx+22,500,15,DIM,'left',400,a4*0.9);
    // 虚线连接
    ctx.save();ctx.globalAlpha=a4*0.55;ctx.strokeStyle=rgba(VIOLET,0.9);
    ctx.setLineDash([6,6]);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(520,340);ctx.lineTo(898,462);ctx.stroke();ctx.restore();
  }

  // 底部三要点
  const pts=[
    ['压缩是有损的','今天讨论的细节，明天可能就想不起来了',ROSE],
    ['所以要分层','结论进摘要，原文进外部存储',TEAL],
    ['别等到爆','提前压，而不是被截断时才压',AMBER]
  ];
  for(let i=0;i<3;i++){
    const st=7.0+i*0.45, a=eo(seg(t,st,st+0.45));
    if(a<=0)continue;
    const w=420,gp=30,x=140+i*(w+gp);
    box(x,566,w,116,mixc(BG,PANEL2,0.5),mixc(LINE,pts[i][2],0.5*a),12,1.5,a);
    T(pts[i][0],x+22,600,17,pts[i][2],'left',700,a);
    T(pts[i][1],x+22,636,14,TXT,'left',400,a*0.9);
  }
  const a5=eo(seg(t,8.6,9.2));
  if(a5>0){
    box(140,706,1320,72,PANEL,mixc(LINE,BLUE,0.5),12,1.7,a5);
    T('一句话',176,742,17,BLUE,'left',700,a5);
    T('上下文窗口是「内存」，外部存储才是「硬盘」。别把硬盘的活交给内存干。',300,742,17,TXT,'left',400,a5);
  }
}

/* ================= S4 顺序与位置 ================= */
function S4(t){
  T('同样一句话，放的位置不同，效果不一样',140,86,40,TXT,'left',700,eo(seg(t,0,0.4)));
  T('它读上下文不是均匀的 —— 开头和结尾看得最清，中间最容易漏',140,136,21,DIM,'left',400,eo(seg(t,0.2,0.7)));

  // 注意力曲线
  const a0=eo(seg(t,0.4,1.2));
  const X0=200,X1=1400,YT=300,YB=470;
  if(a0>0){
    ctx.save();ctx.globalAlpha=a0;
    // 区域填充
    const grad=ctx.createLinearGradient(X0,0,X1,0);

    T('改完看着更好，实际退了 3 条 —— 没有回归测试就发现不了',rx+24,414,13,ROSE,'left',500,a3*0.95);
    T('这就是为什么金标集比任何评测榜单都重要',rx+24,446,13,DIM,'left',400,a3*0.9);
    T('（榜单告诉你"模型多强"，金标集告诉你"你的产品有没有退步"）',rx+24,476,12,DIM,'left',400,a3*0.85);
  }

  // 底部：必记字段
  const a4=eo(seg(t,6.0,6.6));
  if(a4>0){
    const fields=[['完整输入','它到底看到了什么',BLUE],['完整输出','它到底说了什么',VIOLET],['耗时与 token','钱和时间花在哪',AMBER]];
    for(let i=0;i<3;i++){
      const a=eo(seg(t,6.2+i*0.35,6.6+i*0.35));
      if(a<=0)continue;
      const w=420,gp=30,x=140+i*(w+gp);
      box(x,626,w,102,mixc(BG,PANEL2,0.5),mixc(LINE,fields[i][2],0.5*a),12,1.5,a);
      T(fields[i][0],x+22,660,16,fields[i][2],'left',700,a);
      T(fields[i][1],x+22,692,13,TXT,'left',400,a*0.9);
    }
  }
  const a5=eo(seg(t,7.6,8.2));
  T('排查 Agent 问题，80% 的时间花在"搞清它当时到底看到了什么"—— 这件事应该由系统回答，不该靠猜。',140,766,16,DIM,'left',400,a5*0.95);
}

/* ================= S9 收尾 ================= */
function S9(t){
  const a1=eo(seg(t,0.1,0.7)), a3=eo(seg(t,1.7,2.3));
  const g=ctx.createRadialGradient(VW/2,VH/2,40,VW/2,VH/2,560);
  g.addColorStop(0,'rgba(74,141,240,0.13)');g.addColorStop(1,'rgba(74,141,240,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);

  T('三句话收尾',VW/2,146,17,BLUE,'center',600,a1);
  const lines=[
    '上下文是桌面，不是硬盘 —— 管好桌面，比换更大的模型有用。',
    '可靠不是靠模型聪明，是靠护栏、幂等、隔离。',
    '出问题不可怕，看不见问题才可怕。'
  ];
  for(let i=0;i<3;i++){
    const a=eo(seg(t,0.4+i*0.55,0.95+i*0.55));
    T(lines[i],VW/2,232+i*62,25,TXT,'center',500,a);
  }
  ctx.strokeStyle=rgba(BLUE,0.6*a3);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(VW/2-340,452);ctx.lineTo(VW/2+340,452);ctx.stroke();

  T('删掉无用的，比塞进有用的更有效',VW/2,528,30,TEAL,'center',700,a3);
  T('写在外面的约束，比写在提示词里的约束可靠',VW/2,588,24,TXT,'center',500,a3);
  T('被记录下来的失败，才是可以被修复的失败',VW/2,640,24,TXT,'center',500,a3);

  T('第四集完 · 系列：机制 → 内部 → 指令链 → 工程',VW/2,712,18,DIM,'center',500,a3*0.9);
  T('空格 暂停 / 播放    ←  →  切换章节    点进度条跳转',VW/2,800,16,DIM,'center',400,eo(seg(t,3.0,3.6))*0.8);
}

/* ================= 时间轴 ================= */
const SCENES=[
  {n:'开场',      d:4.5, f:S0},
  {n:'桌面比喻',  d:12.0,f:S1},
  {n:'四层预算',  d:13.0,f:S2},
  {n:'压缩',      d:12.0,f:S3},
  {n:'顺序位置',  d:12.0,f:S4},
  {n:'上下文污染',d:11.0,f:S5},
  {n:'三个刹车',  d:13.0,f:S6},
  {n:'沙箱注入',  d:12.0,f:S7},
  {n:'可观测性',  d:11.0,f:S8},
  {n:'收尾',      d:7.0, f:S9}
];
const TOTAL=SCENES.reduce((s,x)=>s+x.d,0);

let clock=0, playing=true, last=0;

function locate(g){
  let acc=0;
  for(let i=0;i<SCENES.length;i++){
    if(g<acc+SCENES[i].d||i===SCENES.length-1)return {i:i,t:g-acc};
    acc+=SCENES[i].d;
  }
  return {i:SCENES.length-1,t:SCENES[SCENES.length-1].d};
}

function drawTopHUD(idx){
  T('Context Engineering · Agent Reliability',44,34,15,DIM,'left',600,1);
  T('/ '+SCENES[idx].n,470,34,15,BLUE,'left',600,1);
}

function drawProgress(g){
  const y=VH-8;
  ctx.fillStyle='rgba(40,52,68,0.9)';ctx.fillRect(0,y,VW,3);
  ctx.fillStyle=BLUE;ctx.fillRect(0,y,VW*(g/TOTAL),3);
  let acc=0;
  for(let i=0;i<SCENES.length;i++){
    const x=VW*(acc/TOTAL);
    ctx.fillStyle=BG;ctx.fillRect(x-1,y-3,2,9);
    acc+=SCENES[i].d;
  }
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=BG;ctx.fillRect(0,0,cv.width/dpr,cv.height/dpr);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,offX*dpr,offY*dpr);

  const loc=locate(clock);
  const sc=SCENES[loc.i];
  const fin=cl01(loc.t/0.42), fout=cl01((sc.d-loc.t)/0.34);
  const alpha=Math.min(fin,fout);

  ctx.save();ctx.globalAlpha=alpha;sc.f(loc.t);ctx.restore();
  drawTopHUD(loc.i);
  drawProgress(clock);
}

function loop(ts){
  if(!last)last=ts;
  let dt=(ts-last)/1000;last=ts;
  if(dt>0.12)dt=0.12;
  if(playing){clock+=dt;if(clock>=TOTAL)clock=0;}
  render();
  requestAnimationFrame(loop);
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const w=window.innerWidth,h=window.innerHeight;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  cv.style.width=w+'px';cv.style.height=h+'px';
  scale=Math.min(w/VW,h/VH);
  offX=(w-VW*scale)/2;offY=(h-VH*scale)/2;
}
window.addEventListener('resize',resize);

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();playing=!playing;last=0;}
  else if(e.code==='ArrowRight'||e.code==='ArrowLeft'){
    const loc=locate(clock);
    let target=e.code==='ArrowRight'?Math.min(loc.i+1,SCENES.length-1):Math.max(loc.i-1,0);
    let acc=0;
    for(let i=0;i<SCENES.length;i++){if(i===target){clock=acc;break;}acc+=SCENES[i].d;}
    last=0;
  } else if(e.key==='r'||e.key==='R'){clock=0;last=0;playing=true;}
});

cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  const w=r.width,h=r.height;
  const s=Math.min(w/VW,h/VH);
  const ox=(w-VW*s)/2, oy=(h-VH*s)/2;
  const vx=(e.clientX-r.left-ox)/s, vy=(e.clientY-r.top-oy)/s;
  if(vy>VH-24){clock=cl01(vx/VW)*TOTAL;last=0;}
  else {playing=!playing;last=0;}
});

try{
  const qp=new URLSearchParams(location.search);
  if(qp.has('t')){
    const v=parseFloat(qp.get('t'));
    if(!isNaN(v))clock=Math.max(0,Math.min(TOTAL-0.04,v));
  }
  if(qp.get('pause')==='1')playing=false;
}catch(err){}

resize();
requestAnimationFrame(loop);
})();
</script>
